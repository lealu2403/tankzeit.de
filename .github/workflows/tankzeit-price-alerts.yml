name: Tankzeit Preisalarm

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-price-alerts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VAPID_PUBLIC_KEY: BNuetuxzqWjZHA9rFpm4JQao_TFT2birrT6gMNntCjBpPtbBU19o9_IPArk7bJY2sl7gNvDWI7d1LTmU73u4kI4
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: mailto:tankzeit@example.com
      TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund

      - name: Check favorite price alerts
        run: node scripts/github-action-alerts.js
