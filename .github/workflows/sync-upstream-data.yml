name: Sync upstream daily data

on:
  schedule:
    # volzinnovation/tankzeit.de starts its daily data update at 00:05 UTC
    # and may wait up to 3 hours for source data. Sync after that window.
    - cron: "30 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-upstream-data.yml"

permissions:
  contents: write

concurrency:
  group: sync-upstream-daily-data
  cancel-in-progress: false

jobs:
  sync-upstream-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Europe/Berlin
      TK_USER: ${{ secrets.TK_USER }}
      TK_PASS: ${{ secrets.TK_PASS }}
    steps:
      - name: Checkout this site
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Fetch upstream repository
        run: |
          git remote add upstream https://github.com/volzinnovation/tankzeit.de.git
          git fetch --depth=1 --filter=blob:none upstream master

      - name: Plan recent management data sync
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Europe/Berlin")).date()
          start = today - timedelta(days=14)
          end = today - timedelta(days=1)
          paths = [
              "data/noon.csv",
              "data/stations.json",
              "data/brent.json",
              "sitemap.xml",
              "robots.txt",
          ]
          current = start
          while current <= end:
              paths.extend(
                  [
                      f"data2/{current:%Y}/{current:%m}/{current:%d}/management_boxplots.json",
                      f"data2/{current:%Y}/{current:%m}/{current:%d}/noon.csv",
                  ]
              )
              current += timedelta(days=1)

          Path("/tmp/upstream-candidate-paths.txt").write_text(
              "\n".join(paths) + "\n",
              encoding="utf-8",
          )
          print(f"Planned {len(paths)} recent generated path candidate(s)")
          print(f"Date window: {start:%Y-%m-%d} to {end:%Y-%m-%d}")
          PY
          while IFS= read -r path; do
            if git cat-file -e "upstream/master:$path" 2>/dev/null; then
              printf '%s\n' "$path"
            fi
          done < /tmp/upstream-candidate-paths.txt \
            > /tmp/upstream-generated-checkout.txt
          wc -l /tmp/upstream-generated-checkout.txt

      - name: Copy recent management data into this site
        run: |
          if [ -s /tmp/upstream-generated-checkout.txt ]; then
            git checkout upstream/master \
              --pathspec-from-file=/tmp/upstream-generated-checkout.txt
          fi

      - name: Enrich management price levels
        run: >-
          python scripts/enrich_management_price_levels.py
          --days 14
          --changed-paths-file /tmp/enriched-management-paths.txt

      - name: Configure git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit synced data
        run: |
          if [ -s /tmp/upstream-generated-checkout.txt ]; then
            git add --pathspec-from-file=/tmp/upstream-generated-checkout.txt
          fi
          if [ -s /tmp/enriched-management-paths.txt ]; then
            git add --pathspec-from-file=/tmp/enriched-management-paths.txt
          fi
          if git diff --cached --quiet; then
            echo "No upstream data changes to sync."
            exit 0
          fi
          git commit -m "Sync upstream daily data"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
