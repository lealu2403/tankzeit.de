name: Sync upstream daily data

on:
  schedule:
    # volzinnovation/tankzeit.de starts its daily data update at 00:05 UTC
    # and may wait up to 3 hours for source data. Sync after that window.
    - cron: "30 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-upstream-data.yml"

permissions:
  contents: write

concurrency:
  group: sync-upstream-daily-data
  cancel-in-progress: false

jobs:
  sync-upstream-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout this site
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch upstream repository
        run: |
          git remote add upstream https://github.com/volzinnovation/tankzeit.de.git
          git fetch --depth=1 --filter=blob:none upstream master

      - name: Plan generated data sync
        run: |
          git diff -z --name-only --diff-filter=ACMRT \
            HEAD upstream/master -- data data2 station sitemap.xml robots.txt \
            > /tmp/upstream-generated-checkout.z
          git diff -z --name-only --diff-filter=D \
            HEAD upstream/master -- data data2 station sitemap.xml robots.txt \
            > /tmp/upstream-generated-delete.z
          python - <<'PY'
          from pathlib import Path

          for name in ("checkout", "delete"):
              payload = Path(f"/tmp/upstream-generated-{name}.z").read_bytes()
              count = len([part for part in payload.split(b"\0") if part])
              print(f"{name}: {count} generated path(s)")
          PY

      - name: Copy changed generated data into this site
        run: |
          if [ -s /tmp/upstream-generated-checkout.z ]; then
            git checkout upstream/master \
              --pathspec-from-file=/tmp/upstream-generated-checkout.z \
              --pathspec-file-nul
          fi
          if [ -s /tmp/upstream-generated-delete.z ]; then
            git rm -q --ignore-unmatch \
              --pathspec-from-file=/tmp/upstream-generated-delete.z \
              --pathspec-file-nul
          fi

      - name: Configure git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit synced data
        run: |
          if git diff --cached --quiet; then
            echo "No upstream data changes to sync."
            exit 0
          fi
          git commit -m "Sync upstream daily data"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
