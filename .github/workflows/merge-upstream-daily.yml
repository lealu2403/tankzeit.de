name: Merge upstream daily

on:
  schedule:
    # volzinnovation/tankzeit.de starts its daily data update at 00:05 UTC
    # and may wait up to 3 hours for source data. Merge after that window.
    - cron: "45 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-upstream-daily
  cancel-in-progress: false

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout this site
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/volzinnovation/tankzeit.de.git
          git fetch upstream master

      - name: Merge upstream master
        run: |
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already contains upstream/master. Nothing to merge."
            exit 0
          fi

          git merge --no-edit upstream/master
          git push origin HEAD:master
