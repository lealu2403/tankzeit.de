    <script>
      const params = new URLSearchParams(window.location.search);
      const stationId = params.get("id") || "";
      const stationName = params.get("name") || "Tankstelle";
      const fuel = (params.get("fuel") || "diesel").toLowerCase();
      const lat = params.get("lat") || "";
      const lng = params.get("lng") || "";
      const DATA_BASE = "data2/";
      let priceLevelChart = null;
      let forecastChart = null;

      const fuelLabels = {
        diesel: "Diesel",
        e10: "E10",
        e5: "E5",
      };

      document.title = `Tankzeit | ${stationName}`;
      document.getElementById("station-name").textContent = stationName;
      document.getElementById("station-fuel").textContent =
        fuelLabels[fuel] || fuel.toUpperCase();

      const metaParts = [];
      if (stationId) metaParts.push(`ID ${stationId}`);
      metaParts.push(`${fuelLabels[fuel] || fuel.toUpperCase()} Detailansicht`);
      document.getElementById("station-meta").textContent = metaParts.join(" - ");

      const backLink = document.getElementById("back-link");
      if (fuel === "e10") {
        backLink.href = "e10.html";
        backLink.textContent = "Zurueck zu E10";
      } else {
        backLink.href = "index.html";
        backLink.textContent = "Zurueck zu Diesel";
      }

      const mapsLink = document.getElementById("maps-link");
      if (lat && lng) {
        mapsLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(
          `${lat},${lng}`,
        )}`;
      } else {
        mapsLink.removeAttribute("href");
        mapsLink.setAttribute("aria-disabled", "true");
        mapsLink.textContent = "Google Maps nicht verfuegbar";
      }

      function stationPath(station) {
        return station.split("-").join("/");
      }

      function formatDate(dateValue) {
        const [year, month, day] = String(dateValue || "").split("-");
        if (!year || !month || !day) return String(dateValue || "");
        return `${day}.${month}.${year}`;
      }

      function selectedRangeLabel(range) {
        if (!range?.from || !range?.to) return "";
        return `${formatDate(range.from)} bis ${formatDate(range.to)}`;
      }

      function updateChartHeadings(range) {
        const fuelName = fuelLabels[fuel] || fuel.toUpperCase();
        const period = selectedRangeLabel(range);
        const suffix = period ? ` · ${fuelName} · ${period}` : ` · ${fuelName}`;
        document.getElementById("price-level-heading").textContent =
          `Preisniveau 12:00 Uhr bis 12:00 Uhr${suffix}`;
        document.getElementById("forecast-heading").textContent =
          `Prognose${suffix}`;
      }

      function formatFuelPrice(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount)) return "-";
        return new Intl.NumberFormat("de-DE", {
          minimumFractionDigits: 3,
          maximumFractionDigits: 3,
        }).format(amount);
      }

      function formatEuroTick(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount)) return "-";
        return new Intl.NumberFormat("de-DE", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(amount);
      }

      function priceLevelDomain(values) {
        const finiteValues = values.filter((value) => Number.isFinite(value));
        if (!finiteValues.length) return { min: 1.5, max: 2.5 };
        const min = Math.min(...finiteValues);
        const max = Math.max(...finiteValues);
        if (Math.abs(max - min) < 0.0005) {
          const pad = Math.max(0.02, Math.abs(max || 1) * 0.01);
          return { min: min - pad, max: max + pad };
        }
        const pad = Math.max(0.02, (max - min) * 0.12);
        return { min: min - pad, max: max + pad };
      }

      function currentChartTheme() {
        const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        return isDark
          ? {
              axisLabel: "rgba(237, 244, 243, 0.82)",
              axisTitle: "rgba(237, 244, 243, 0.92)",
              grid: "rgba(148, 163, 184, 0.16)",
              border: "rgba(148, 163, 184, 0.34)",
              tooltipBackground: "rgba(9, 14, 17, 0.96)",
            }
          : {
              axisLabel: "rgba(31, 41, 55, 0.76)",
              axisTitle: "rgba(31, 41, 55, 0.88)",
              grid: "rgba(15, 118, 110, 0.14)",
              border: "rgba(15, 118, 110, 0.26)",
              tooltipBackground: "rgba(17, 24, 39, 0.94)",
            };
      }

      function applyChartTheme(options) {
        const theme = currentChartTheme();
        const scales = options.scales || {};
        Object.values(scales).forEach((scale) => {
          scale.ticks = {
            color: theme.axisLabel,
            ...(scale.ticks || {}),
          };
          scale.title = {
            color: theme.axisTitle,
            ...(scale.title || {}),
          };
          scale.grid = {
            color: theme.grid,
            ...(scale.grid || {}),
          };
          scale.border = {
            color: theme.border,
            ...(scale.border || {}),
          };
        });
        options.scales = scales;
        options.layout = {
          padding: {
            top: 8,
            right: 10,
            bottom: 0,
            left: 4,
          },
          ...(options.layout || {}),
        };
        options.plugins = {
          ...(options.plugins || {}),
          tooltip: {
            backgroundColor: theme.tooltipBackground,
            titleColor: "#f8fafc",
            bodyColor: "#f8fafc",
            borderColor: "rgba(255,255,255,0.14)",
            borderWidth: 1,
            ...(options.plugins?.tooltip || {}),
          },
          legend: {
            labels: { color: theme.axisTitle },
            ...(options.plugins?.legend || {}),
          },
        };
        return options;
      }

      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return response.json();
      }

      async function fetchText(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return response.text();
      }

      function parseCsv(text) {
        const lines = text
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean);
        if (!lines.length) return [];
        const headers = lines[0].split(",").map((header) => header.trim());
        return lines.slice(1).map((line) => {
          const values = line.split(",");
          const row = {};
          headers.forEach((header, index) => {
            row[header] = values[index] ?? "";
          });
          return row;
        });
      }

      function waitForChartJs() {
        return new Promise((resolve) => {
          if (typeof Chart !== "undefined") {
            resolve();
            return;
          }
          const timer = window.setInterval(() => {
            if (typeof Chart !== "undefined") {
              window.clearInterval(timer);
              resolve();
            }
          }, 50);
        });
      }

      function normalizePriceRows(stats) {
        const rows = Array.isArray(stats?.cycle_hourly) ? stats.cycle_hourly : [];
        return rows
          .map((row) => {
            const cycleHour = Number(row?.cycle_hour);
            const clockHour = Number(
              row?.clock_hour != null ? row.clock_hour : row?.label,
            );
            const priceCandidates = [
              row?.price_median,
              row?.price_avg,
              row?.price_min,
              row?.price_max,
            ];
            let price = null;
            for (const candidate of priceCandidates) {
              const numeric = Number(candidate);
              if (Number.isFinite(numeric)) {
                price = numeric;
                break;
              }
            }
            if (!Number.isFinite(cycleHour) || !Number.isFinite(clockHour) || price === null) {
              return null;
            }
            const normalizedClockHour = ((Math.round(clockHour) % 24) + 24) % 24;
            return {
              cycleHour,
              clockHour: normalizedClockHour,
              label:
                typeof row?.label === "string" && row.label.trim()
                  ? row.label.trim()
                  : String(normalizedClockHour).padStart(2, "0"),
              price,
              count: Number(row?.count) || 0,
            };
          })
          .filter((row) => row !== null)
          .sort((left, right) => left.cycleHour - right.cycleHour);
      }

      function normalizeHistoryRows(rows) {
        return rows
          .map((row) => {
            const price = Number(row?.price);
            const date = String(row?.date || "");
            if (!date || !Number.isFinite(price)) return null;
            return { date, price };
          })
          .filter((row) => row !== null)
          .sort((left, right) => left.date.localeCompare(right.date));
      }

      function findHistoryPrice(historyRows, day) {
        const match = historyRows.find((row) => row.date === day);
        return match ? match.price : null;
      }

      function shiftIsoDay(day, offsetDays) {
        const [year, month, date] = String(day || "")
          .split("-")
          .map((part) => Number(part));
        if (
          !Number.isInteger(year) ||
          !Number.isInteger(month) ||
          !Number.isInteger(date)
        ) {
          return "";
        }
        const shifted = new Date(Date.UTC(year, month - 1, date + offsetDays));
        return shifted.toISOString().slice(0, 10);
      }

      function previousDay(day) {
        return shiftIsoDay(day, -1);
      }

      function nextDay(day) {
        return shiftIsoDay(day, 1);
      }

      function eachCycleStartDay(fromDay, toDay) {
        const days = [];
        let currentDay = fromDay;
        let guard = 0;
        const endDay = fromDay === toDay ? nextDay(toDay) : toDay;
        while (currentDay && currentDay < endDay && guard < 370) {
          days.push(currentDay);
          currentDay = nextDay(currentDay);
          guard += 1;
        }
        return days;
      }

      function normalizeFallbackPriceRows(stats, historyRows, selectedRange) {
        const hourlyRows = Array.isArray(stats?.hourly) ? stats.hourly : [];
        if (!hourlyRows.length || !historyRows.length) return { rows: [], summary: null };

        const firstHistoryDay = historyRows[0]?.date || "";
        const lastHistoryDay = historyRows[historyRows.length - 1]?.date || "";
        const fromDay = selectedRange?.from || firstHistoryDay;
        const toDay = selectedRange?.to || lastHistoryDay;
        const cycleStartDays = eachCycleStartDay(fromDay, toDay);
        if (!cycleStartDays.length) return { rows: [], summary: null };

        const byHour = new Map();
        hourlyRows.forEach((row) => {
          const hour = Number(row?.hour);
          const delta = Number(row?.price);
          if (Number.isFinite(hour) && Number.isFinite(delta)) {
            byHour.set(Math.round(hour), delta);
          }
        });

        const rows = [];
        cycleStartDays.forEach((day, dayIndex) => {
          const referencePrice = findHistoryPrice(historyRows, day);
          const closingPrice =
            findHistoryPrice(historyRows, nextDay(day)) ?? referencePrice;
          if (!Number.isFinite(referencePrice)) {
            return;
          }

          for (let cycleHour = 0; cycleHour <= 24; cycleHour += 1) {
            if (dayIndex > 0 && cycleHour === 0) continue;
            const clockHour = (12 + cycleHour) % 24;
            const sourceHour = cycleHour === 24 ? 12 : clockHour;
            const delta = byHour.get(sourceHour);
            if (!Number.isFinite(delta)) continue;
            const price =
              cycleHour === 0
                ? referencePrice
                : cycleHour === 24
                  ? closingPrice
                  : referencePrice + delta;
            const date = cycleHour < 12 ? day : nextDay(day);
            rows.push({
              cycleHour: rows.length,
              clockHour,
              date,
              label:
                clockHour === 12
                  ? `${formatDate(date).slice(0, 5)} 12:00 Uhr`
                  : `${String(clockHour).padStart(2, "0")}:00`,
              price: Number(price.toFixed(3)),
              count: 1,
            });
          }
        });

        return {
          rows,
          summary: {
            cycle_start: firstHistoryDay,
            cycle_end: lastHistoryDay,
            fallback: true,
          },
        };
      }

      function updateRangeControls(summary) {
        const fromInput = document.getElementById("cycle-from");
        const toInput = document.getElementById("cycle-to");
        const cycleStart = summary?.cycle_start || "";
        const cycleEnd = summary?.cycle_end || "";
        if (!cycleStart || !cycleEnd) {
          fromInput.disabled = true;
          toInput.disabled = true;
          return { from: "", to: "" };
        }

        fromInput.min = cycleStart;
        fromInput.max = cycleEnd;
        toInput.min = cycleStart;
        toInput.max = cycleEnd;
        const requestedFrom = params.get("from") || cycleStart;
        const requestedTo = params.get("to") || cycleEnd;
        fromInput.value =
          requestedFrom >= cycleStart && requestedFrom <= cycleEnd
            ? requestedFrom
            : cycleStart;
        toInput.value =
          requestedTo >= cycleStart && requestedTo <= cycleEnd
            ? requestedTo
            : cycleEnd;
        if (fromInput.value > toInput.value) {
          fromInput.value = toInput.value;
        }
        fromInput.disabled = false;
        toInput.disabled = false;
        return { from: fromInput.value, to: toInput.value };
      }

      function updateRangeInUrl() {
        const fromInput = document.getElementById("cycle-from");
        const toInput = document.getElementById("cycle-to");
        if (fromInput.value) params.set("from", fromInput.value);
        if (toInput.value) params.set("to", toInput.value);
        window.history.replaceState(
          {},
          "",
          `${window.location.pathname}?${params.toString()}`,
        );
      }

      function applySelectedRange() {
        updateRangeInUrl();
        loadPriceLevelChart();
      }

      function clearPriceLevelChart() {
        if (priceLevelChart) {
          priceLevelChart.destroy();
          priceLevelChart = null;
        }
      }

      function clearForecastChart() {
        if (forecastChart) {
          forecastChart.destroy();
          forecastChart = null;
        }
      }

      function fallbackForecastRows() {
        return Array.from({ length: 25 }, (_, index) => {
          const clockHour = (12 + index) % 24;
          return {
            label: `${String(clockHour).padStart(2, "0")}:00`,
            price: null,
            clockHour,
            date: "",
          };
        });
      }

      function renderForecastCoordinateSystem(rows) {
        const chartRows = rows.length ? rows : fallbackForecastRows();
        const labels = chartRows.map((row) => row.label);
        const domain = priceLevelDomain(
          chartRows.map((row) => row.price).filter((value) => value != null),
        );
        const visibleTickIndexes = new Set();
        const shortRange = chartRows.length <= 30;
        const mediumRange = chartRows.length <= 96;
        chartRows.forEach((row, index) => {
          if (shortRange && index % 3 === 0) {
            visibleTickIndexes.add(index);
            return;
          }
          if (row.clockHour === 12) {
            visibleTickIndexes.add(index);
            return;
          }
          if (mediumRange && row.clockHour === 0) {
            visibleTickIndexes.add(index);
          }
        });
        const midnightIndexes = chartRows
          .map((row, index) => (row.clockHour === 0 ? index : -1))
          .filter((index) => index >= 0);
        const ctx = document.getElementById("forecast-chart").getContext("2d");
        if (forecastChart) forecastChart.destroy();
        forecastChart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Prognose",
                data: chartRows.map(() => null),
                borderColor: "#0f766e",
                backgroundColor: "rgba(15, 118, 110, 0.08)",
                borderWidth: 2.4,
                pointRadius: 0,
                tension: 0,
                fill: false,
              },
            ],
          },
          options: applyChartTheme({
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            devicePixelRatio: Math.max(1, window.devicePixelRatio || 1),
            scales: {
              x: {
                alignToPixels: true,
                grid: {
                  color(context) {
                    return visibleTickIndexes.has(context.index)
                      ? currentChartTheme().grid
                      : "rgba(0, 0, 0, 0)";
                  },
                  lineWidth(context) {
                    return visibleTickIndexes.has(context.index) ? 1 : 0;
                  },
                },
                title: {
                  display: true,
                  text: "Zeitachse 12:00 Uhr bis 12:00 Uhr",
                  font: {
                    size: 12,
                    weight: "700",
                  },
                },
                ticks: {
                  autoSkip: false,
                  maxRotation: 0,
                  minRotation: 0,
                  padding: 8,
                  font: {
                    size: 11,
                    weight: "700",
                  },
                  callback(value, index) {
                    if (!visibleTickIndexes.has(index)) return "";
                    const row = chartRows[index];
                    if (!row) return "";
                    if (row.clockHour === 12 && row.date) {
                      return `${formatDate(row.date).slice(0, 5)} 12`;
                    }
                    return row.label.replace(":00", "");
                  },
                },
              },
              y: {
                alignToPixels: true,
                min: domain.min,
                max: domain.max,
                grid: {
                  lineWidth: 1,
                },
                ticks: {
                  padding: 8,
                  font: {
                    size: 11,
                    weight: "700",
                  },
                  callback(value) {
                    return formatEuroTick(value);
                  },
                },
                title: {
                  display: true,
                  text: "Preis (EUR/l)",
                  font: {
                    size: 12,
                    weight: "700",
                  },
                },
              },
            },
            plugins: {
              legend: {
                display: false,
              },
              tooltip: {
                enabled: false,
              },
            },
          }),
          plugins: [
            {
              id: "stationForecastMidnightDivider",
              afterDraw(chart) {
                if (!midnightIndexes.length) return;
                const xScale = chart.scales.x;
                const chartArea = chart.chartArea;
                if (!xScale || !chartArea) return;
                const { ctx } = chart;
                ctx.save();
                midnightIndexes.forEach((midnightIndex) => {
                  const dividerX = xScale.getPixelForValue(midnightIndex);
                  ctx.setLineDash([6, 4]);
                  ctx.strokeStyle = "rgba(37, 99, 235, 0.34)";
                  ctx.lineWidth = 1.2;
                  ctx.beginPath();
                  ctx.moveTo(dividerX, chartArea.top);
                  ctx.lineTo(dividerX, chartArea.bottom);
                  ctx.stroke();
                  ctx.setLineDash([]);
                });
                ctx.restore();
              },
            },
          ],
        });
      }

      function renderPriceLevelChart(rows) {
        const labels = rows.map((row) => row.label);
        const values = rows.map((row) => row.price);
        const domain = priceLevelDomain(values);
        const visibleTickIndexes = new Set();
        const shortRange = rows.length <= 30;
        const mediumRange = rows.length <= 96;
        rows.forEach((row, index) => {
          if (shortRange && index % 3 === 0) {
            visibleTickIndexes.add(index);
            return;
          }
          if (row.clockHour === 12) {
            visibleTickIndexes.add(index);
            return;
          }
          if (mediumRange && row.clockHour === 0) {
            visibleTickIndexes.add(index);
          }
        });
        const midnightIndexes = rows
          .map((row, index) => (row.clockHour === 0 ? index : -1))
          .filter((index) => index >= 0);
        const ctx = document.getElementById("price-level-chart").getContext("2d");
        if (priceLevelChart) priceLevelChart.destroy();
        priceLevelChart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: `${fuelLabels[fuel] || fuel.toUpperCase()} Preisniveau`,
                data: values,
                borderColor: "#0f766e",
                backgroundColor: "rgba(15, 118, 110, 0.14)",
                borderWidth: 2.4,
                borderJoinStyle: "round",
                borderCapStyle: "round",
                pointRadius: rows.length > 96 ? 0 : 2,
                pointHoverRadius: 4,
                stepped: "before",
                tension: 0,
                fill: true,
              },
            ],
          },
          options: applyChartTheme({
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            devicePixelRatio: Math.max(1, window.devicePixelRatio || 1),
            interaction: {
              mode: "index",
              intersect: false,
            },
            scales: {
              x: {
                alignToPixels: true,
                grid: {
                  color(context) {
                    return visibleTickIndexes.has(context.index)
                      ? currentChartTheme().grid
                      : "rgba(0, 0, 0, 0)";
                  },
                  lineWidth(context) {
                    return visibleTickIndexes.has(context.index) ? 1 : 0;
                  },
                },
                title: {
                  display: true,
                  text: "Zeitachse 12:00 Uhr bis 12:00 Uhr",
                  font: {
                    size: 12,
                    weight: "700",
                  },
                },
                ticks: {
                  autoSkip: false,
                  maxRotation: 0,
                  minRotation: 0,
                  padding: 8,
                  font: {
                    size: 11,
                    weight: "700",
                  },
                  callback(value, index) {
                    if (!visibleTickIndexes.has(index)) return "";
                    const row = rows[index];
                    if (!row) return "";
                    if (row.clockHour === 12 && row.date) {
                      return `${formatDate(row.date).slice(0, 5)} 12`;
                    }
                    return row.label.replace(":00", "");
                  },
                },
              },
              y: {
                alignToPixels: true,
                min: domain.min,
                max: domain.max,
                grid: {
                  lineWidth: 1,
                },
                ticks: {
                  padding: 8,
                  font: {
                    size: 11,
                    weight: "700",
                  },
                  callback(value) {
                    return formatEuroTick(value);
                  },
                },
                title: {
                  display: true,
                  text: "Preis (EUR/l)",
                  font: {
                    size: 12,
                    weight: "700",
                  },
                },
              },
            },
            plugins: {
              legend: {
                position: "bottom",
              },
              tooltip: {
                callbacks: {
                  label(context) {
                    const row = rows[context.dataIndex];
                    if (!row) return "";
                    return `${formatFuelPrice(row.price)} EUR/l`;
                  },
                  afterBody(context) {
                    const row = rows[context[0]?.dataIndex];
                    if (!row) return [];
                    const lines = [
                      row.date
                        ? `Zeit: ${formatDate(row.date)} ${String(row.clockHour).padStart(2, "0")}:00`
                        : `Uhrzeit: ${row.label}`,
                    ];
                    if (row.count) lines.push(`Zyklen: ${row.count}`);
                    return lines;
                  },
                },
              },
            },
          }),
          plugins: [
            {
              id: "stationDetailMidnightDivider",
              afterDraw(chart) {
                if (!midnightIndexes.length) return;
                const xScale = chart.scales.x;
                const chartArea = chart.chartArea;
                if (!xScale || !chartArea) return;
                const { ctx } = chart;
                ctx.save();
                midnightIndexes.forEach((midnightIndex) => {
                  const dividerX = xScale.getPixelForValue(midnightIndex);
                  ctx.setLineDash([6, 4]);
                  ctx.strokeStyle = "rgba(37, 99, 235, 0.34)";
                  ctx.lineWidth = 1.2;
                  ctx.beginPath();
                  ctx.moveTo(dividerX, chartArea.top);
                  ctx.lineTo(dividerX, chartArea.bottom);
                  ctx.stroke();
                  ctx.setLineDash([]);
                });
                ctx.restore();
              },
            },
          ],
        });
      }

      async function loadPriceLevelChart() {
        const note = document.getElementById("price-level-note");
        if (!stationId) {
          clearForecastChart();
          note.textContent = "Keine Station ausgewaehlt.";
          return;
        }
        try {
          await waitForChartJs();
          renderForecastCoordinateSystem([]);
          const stats = await fetchJson(`${DATA_BASE}${stationPath(stationId)}/${fuel}.json`);
          let rows = normalizePriceRows(stats);
          let summary = stats?.cycle_summary || {};
          let isFallback = false;
          if (!rows.length) {
            const historyText = await fetchText(
              `${DATA_BASE}${stationPath(stationId)}/${fuel}/history.csv`,
            );
            const historyRows = normalizeHistoryRows(parseCsv(historyText));
            const historySummary = {
              cycle_start: historyRows[0]?.date || "",
              cycle_end: historyRows[historyRows.length - 1]?.date || "",
            };
            const fallbackRange = updateRangeControls(historySummary);
            const fallback = normalizeFallbackPriceRows(
              stats,
              historyRows,
              fallbackRange,
            );
            rows = fallback.rows;
            summary = fallback.summary || summary;
            isFallback = rows.length > 0;
          }
          const selectedRange = isFallback
            ? {
                from: document.getElementById("cycle-from").value,
                to: document.getElementById("cycle-to").value,
              }
            : updateRangeControls(summary);
          updateChartHeadings(selectedRange);
          if (!rows.length) {
            clearPriceLevelChart();
            renderForecastCoordinateSystem([]);
            note.textContent = "Fuer diese Station liegt noch kein Preisniveau von 12:00 Uhr bis 12:00 Uhr vor.";
            return;
          }
          renderPriceLevelChart(rows);
          renderForecastCoordinateSystem(rows);
          const availableStart = isFallback
            ? selectedRange.from
            : summary.cycle_start || selectedRange.from;
          const availableEnd = isFallback
            ? selectedRange.to
            : summary.cycle_end || selectedRange.to;
          note.textContent = `${fuelLabels[fuel] || fuel.toUpperCase()} - 12:00 Uhr bis 12:00 Uhr - ${formatDate(
            availableStart,
          )} bis ${formatDate(availableEnd)}${
            isFallback ? " - aus Tagesprofil und Mittagspreisen abgeleitet" : ""
          }`;
        } catch (err) {
          note.textContent = "Preisniveau konnte lokal nicht geladen werden.";
        }
      }

      document.getElementById("cycle-range-toggle").addEventListener("click", () => {
        const panel = document.getElementById("cycle-range-panel");
        const toggle = document.getElementById("cycle-range-toggle");
        const shouldOpen = panel.hasAttribute("hidden");
        panel.hidden = !shouldOpen;
        toggle.setAttribute("aria-expanded", String(shouldOpen));
      });
      document.getElementById("cycle-range-apply").addEventListener("click", applySelectedRange);
      document.getElementById("cycle-from").addEventListener("change", updateRangeInUrl);
      document.getElementById("cycle-to").addEventListener("change", updateRangeInUrl);

      loadPriceLevelChart();
    </script>
  </body>
</html>
