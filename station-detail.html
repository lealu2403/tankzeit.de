<!doctype html>

  <body class="station-page">
    <main class="station-shell station-detail-shell">
      <a class="legal-back" href="index.html" id="back-link">Zur&uuml;ck</a>

      <section class="station-hero station-detail-hero">
        <p class="legal-kicker">Tankzeit Station</p>
        <h1 id="station-name">Tankstelle</h1>
        <p class="station-summary" id="station-meta">
          Detailansicht f&uuml;r das 12:00-bis-12:00-Preisniveau.
        </p>
        <div class="station-chip-row">
          <span class="station-chip" id="station-fuel">Kraftstoff</span>
          <span class="station-chip">12:00 bis 12:00</span>
        </div>
        <div class="station-actions">
          <a
            class="link-btn"
            id="maps-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            >In Google Maps &ouml;ffnen</a
          >
        </div>
      </section>

      <section class="legal-card station-detail-card">
        <div class="station-detail-card-heading">
          <div>
            <p class="legal-kicker">Chart</p>
            <h2>Preisniveau 12:00 bis 12:00</h2>
          </div>
          <div class="station-detail-range" aria-label="Zeitraum">
            <label for="cycle-from">
              Von
              <input id="cycle-from" type="date" />
            </label>
            <label for="cycle-to">
              Bis
              <input id="cycle-to" type="date" />
            </label>
          </div>
        </div>
        <div class="station-detail-chart-wrap">
          <canvas id="price-level-chart"></canvas>
        </div>
        <p class="chart-note station-detail-chart-note" id="price-level-note">
          Lade Preisniveau...
        </p>
      </section>

      <section class="legal-card station-detail-card">
        <div class="station-detail-card-heading">
          <div>
            <p class="legal-kicker">Chart</p>
            <h2>Prognose</h2>
          </div>
          <div class="station-detail-range" aria-label="Prognosezeitraum">
            <label>
              Modus
              <select disabled>
                <option>Stationsdaten</option>
              </select>
            </label>
          </div>
        </div>
        <div
          class="station-detail-chart-placeholder forecast-placeholder"
          role="img"
          aria-label="Vorbereiteter Chartbereich fuer die Prognose dieser Tankstelle"
        >
          <div class="station-detail-axis station-detail-axis-y"></div>
          <div class="station-detail-axis station-detail-axis-x"></div>
          <p>Prognose-Chart vorbereitet</p>
        </div>
      </section>
    </main>

    <nav class="nav-bar" aria-label="Hauptnavigation">
      <a href="index.html" class="nav-item diesel">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 22s8-4 8-10c0-4.42-3.58-8-8-8s-8 3.58-8 8c0 6 8 10 8 10z"

        <span>Diesel</span>

      <a href="e10.html" class="nav-item e10">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 22s8-4 8-10c0-4.42-3.58-8-8-8s-8 3.58-8 8c0 6 8 10 8 10z"

        </svg>
        <span>E10</span>

      <a href="favoriten.html" class="nav-item">

            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
          />

        <svg viewBox="0 0 24 24">

    <script>
      const params = new URLSearchParams(window.location.search);
      const stationId = params.get("id") || "";
      const stationName = params.get("name") || "Tankstelle";
      const fuel = (params.get("fuel") || "diesel").toLowerCase();
      const lat = params.get("lat") || "";
      const lng = params.get("lng") || "";
      const DATA_BASE = "data2/";
      let priceLevelChart = null;

      const fuelLabels = {
        diesel: "Diesel",
        e10: "E10",
        e5: "E5",
      };

      document.title = `Tankzeit | ${stationName}`;
      document.getElementById("station-name").textContent = stationName;
      document.getElementById("station-fuel").textContent =
        fuelLabels[fuel] || fuel.toUpperCase();

      const metaParts = [];
      if (stationId) metaParts.push(`ID ${stationId}`);
      metaParts.push(`${fuelLabels[fuel] || fuel.toUpperCase()} Detailansicht`);
      document.getElementById("station-meta").textContent = metaParts.join(" - ");

      const backLink = document.getElementById("back-link");
      if (fuel === "e10") {
        backLink.href = "e10.html";
        backLink.textContent = "Zurueck zu E10";
      } else {
        backLink.href = "index.html";
        backLink.textContent = "Zurueck zu Diesel";
      }

      const mapsLink = document.getElementById("maps-link");
      if (lat && lng) {
        mapsLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(
          `${lat},${lng}`,
        )}`;
      } else {
        mapsLink.removeAttribute("href");
        mapsLink.setAttribute("aria-disabled", "true");
        mapsLink.textContent = "Google Maps nicht verfuegbar";
      }

      function stationPath(station) {
        return station.split("-").join("/");
      }

      function formatDate(dateValue) {
        const [year, month, day] = String(dateValue || "").split("-");
        if (!year || !month || !day) return String(dateValue || "");
        return `${day}.${month}.${year}`;
      }

      function formatFuelPrice(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount)) return "-";
        return new Intl.NumberFormat("de-DE", {
          minimumFractionDigits: 3,
          maximumFractionDigits: 3,
        }).format(amount);
      }

      function formatEuroTick(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount)) return "-";
        return new Intl.NumberFormat("de-DE", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(amount);
      }

      function priceLevelDomain(values) {
        const finiteValues = values.filter((value) => Number.isFinite(value));
        if (!finiteValues.length) return { min: 1.5, max: 2.5 };
        const min = Math.min(...finiteValues);
        const max = Math.max(...finiteValues);
        if (Math.abs(max - min) < 0.0005) {
          const pad = Math.max(0.02, Math.abs(max || 1) * 0.01);
          return { min: min - pad, max: max + pad };
        }
        const pad = Math.max(0.02, (max - min) * 0.12);
        return { min: min - pad, max: max + pad };
      }

      function currentChartTheme() {
        const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        return isDark
          ? {
              axisLabel: "rgba(237, 244, 243, 0.82)",
              axisTitle: "rgba(237, 244, 243, 0.92)",
              grid: "rgba(148, 163, 184, 0.18)",
              border: "rgba(148, 163, 184, 0.3)",
              tooltipBackground: "rgba(9, 14, 17, 0.96)",
            }
          : {
              axisLabel: "rgba(31, 41, 55, 0.76)",
              axisTitle: "rgba(31, 41, 55, 0.88)",
              grid: "rgba(15, 118, 110, 0.12)",
              border: "rgba(15, 118, 110, 0.2)",
              tooltipBackground: "rgba(17, 24, 39, 0.94)",
            };
      }

      function applyChartTheme(options) {
        const theme = currentChartTheme();
        const scales = options.scales || {};
        Object.values(scales).forEach((scale) => {
          scale.ticks = {
            color: theme.axisLabel,
            ...(scale.ticks || {}),
          };
          scale.title = {
            color: theme.axisTitle,
            ...(scale.title || {}),
          };
          scale.grid = {
            color: theme.grid,
            ...(scale.grid || {}),
          };
          scale.border = {
            color: theme.border,
            ...(scale.border || {}),
          };
        });
        options.scales = scales;
        options.plugins = {
          ...(options.plugins || {}),
          tooltip: {
            backgroundColor: theme.tooltipBackground,
            titleColor: "#f8fafc",
            bodyColor: "#f8fafc",
            borderColor: "rgba(255,255,255,0.14)",
            borderWidth: 1,
            ...(options.plugins?.tooltip || {}),
          },
          legend: {
            labels: { color: theme.axisTitle },
            ...(options.plugins?.legend || {}),
          },
        };
        return options;
      }

      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return response.json();
      }

      function waitForChartJs() {
        return new Promise((resolve) => {
          if (typeof Chart !== "undefined") {
            resolve();
            return;
          }
          const timer = window.setInterval(() => {
            if (typeof Chart !== "undefined") {
              window.clearInterval(timer);
              resolve();
            }
          }, 50);
        });
      }

      function normalizePriceRows(stats) {
        const rows = Array.isArray(stats?.cycle_hourly) ? stats.cycle_hourly : [];
        return rows
          .map((row) => {
            const cycleHour = Number(row?.cycle_hour);
            const clockHour = Number(
              row?.clock_hour != null ? row.clock_hour : row?.label,
            );
            const priceCandidates = [
              row?.price_median,
              row?.price_avg,
              row?.price_min,
              row?.price_max,
            ];
            let price = null;
            for (const candidate of priceCandidates) {
              const numeric = Number(candidate);
              if (Number.isFinite(numeric)) {
                price = numeric;
                break;
              }
            }
            if (!Number.isFinite(cycleHour) || !Number.isFinite(clockHour) || price === null) {
              return null;
            }
            const normalizedClockHour = ((Math.round(clockHour) % 24) + 24) % 24;
            return {
              cycleHour,
              clockHour: normalizedClockHour,
              label:
                typeof row?.label === "string" && row.label.trim()
                  ? row.label.trim()
                  : String(normalizedClockHour).padStart(2, "0"),
              price,
              count: Number(row?.count) || 0,
            };
          })
          .filter((row) => row !== null)
          .sort((left, right) => left.cycleHour - right.cycleHour);
      }

      function updateRangeControls(summary) {
        const fromInput = document.getElementById("cycle-from");
        const toInput = document.getElementById("cycle-to");
        const cycleStart = summary?.cycle_start || "";
        const cycleEnd = summary?.cycle_end || "";
        if (!cycleStart || !cycleEnd) {
          fromInput.disabled = true;
          toInput.disabled = true;
          return { from: "", to: "" };
        }

        fromInput.min = cycleStart;
        fromInput.max = cycleEnd;
        toInput.min = cycleStart;
        toInput.max = cycleEnd;
        fromInput.value = params.get("from") || cycleStart;
        toInput.value = params.get("to") || cycleEnd;
        fromInput.disabled = false;
        toInput.disabled = false;
        return { from: fromInput.value, to: toInput.value };
      }

      function updateRangeInUrl() {
        const fromInput = document.getElementById("cycle-from");
        const toInput = document.getElementById("cycle-to");
        if (fromInput.value) params.set("from", fromInput.value);
        if (toInput.value) params.set("to", toInput.value);
        window.history.replaceState(
          {},
          "",
          `${window.location.pathname}?${params.toString()}`,
        );
      }

      function renderPriceLevelChart(rows) {
        const labels = rows.map((row) => `${row.label}:00`);
        const values = rows.map((row) => row.price);
        const domain = priceLevelDomain(values);
        const midnightIndex = rows.findIndex((row) => row.clockHour === 0);
        const ctx = document.getElementById("price-level-chart").getContext("2d");
        if (priceLevelChart) priceLevelChart.destroy();
        priceLevelChart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: `${fuelLabels[fuel] || fuel.toUpperCase()} Preisniveau`,
                data: values,
                borderColor: "#0f766e",
                backgroundColor: "rgba(15, 118, 110, 0.14)",
                borderWidth: 2.4,
                pointRadius: 2,
                pointHoverRadius: 4,
                stepped: "before",
                tension: 0,
                fill: true,
              },
            ],
          },
          options: applyChartTheme({
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: "index",
              intersect: false,
            },
            scales: {
              x: {
                title: {
                  display: true,
                  text: "Stunde im 24h-Zyklus",
                },
              },
              y: {
                min: domain.min,
                max: domain.max,
                ticks: {
                  callback(value) {
                    return formatEuroTick(value);
                  },
                },
                title: {
                  display: true,
                  text: "Preis (EUR/l)",
                },
              },
            },
            plugins: {
              legend: {
                position: "bottom",
              },
              tooltip: {
                callbacks: {
                  label(context) {
                    const row = rows[context.dataIndex];
                    if (!row) return "";
                    return `${formatFuelPrice(row.price)} EUR/l`;
                  },
                  afterBody(context) {
                    const row = rows[context[0]?.dataIndex];
                    if (!row) return [];
                    const lines = [`Uhrzeit: ${row.label}:00`];
                    if (row.count) lines.push(`Zyklen: ${row.count}`);
                    return lines;
                  },
                },
              },
            },
          }),
          plugins: [
            {
              id: "stationDetailMidnightDivider",
              afterDraw(chart) {
                if (midnightIndex < 0) return;
                const xScale = chart.scales.x;
                const chartArea = chart.chartArea;
                if (!xScale || !chartArea) return;
                const dividerX = xScale.getPixelForValue(midnightIndex);
                const { ctx } = chart;
                ctx.save();
                ctx.setLineDash([6, 4]);
                ctx.strokeStyle = "rgba(37, 99, 235, 0.38)";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(dividerX, chartArea.top);
                ctx.lineTo(dividerX, chartArea.bottom);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = currentChartTheme().axisLabel;
                ctx.font = "12px Manrope, sans-serif";
                ctx.fillText("00:00", dividerX + 6, chartArea.top + 14);
                ctx.restore();
              },
            },
          ],
        });
      }

      async function loadPriceLevelChart() {
        const note = document.getElementById("price-level-note");
        if (!stationId) {
          note.textContent = "Keine Station ausgewaehlt.";
          return;
        }
        try {
          await waitForChartJs();
          const stats = await fetchJson(`${DATA_BASE}${stationPath(stationId)}/${fuel}.json`);
          const rows = normalizePriceRows(stats);
          const selectedRange = updateRangeControls(stats?.cycle_summary);
          if (!rows.length) {
            note.textContent = "Fuer diese Station liegt noch kein 12:00-bis-12:00-Preisniveau vor.";
            return;
          }
          renderPriceLevelChart(rows);
          const summary = stats?.cycle_summary || {};
          const availableStart = summary.cycle_start || selectedRange.from;
          const availableEnd = summary.cycle_end || selectedRange.to;
          note.textContent = `${fuelLabels[fuel] || fuel.toUpperCase()} - 12:00 bis 12:00 - ${formatDate(
            availableStart,
          )} bis ${formatDate(availableEnd)}`;
        } catch (err) {
          note.textContent = "Preisniveau konnte lokal nicht geladen werden.";
        }
      }

      document.getElementById("cycle-from").addEventListener("change", () => {
        updateRangeInUrl();
        loadPriceLevelChart();
      });
      document.getElementById("cycle-to").addEventListener("change", () => {
        updateRangeInUrl();
        loadPriceLevelChart();
      });

      loadPriceLevelChart();
    </script>
  </body>
