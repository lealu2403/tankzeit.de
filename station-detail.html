    <script>
      const params = new URLSearchParams(window.location.search);
      const stationId = params.get("id") || "";
      const stationName = params.get("name") || "Tankstelle";
      const fuel = (params.get("fuel") || "diesel").toLowerCase();
      const lat = params.get("lat") || "";
      const lng = params.get("lng") || "";
      const stationBrand = params.get("brand") || "";
      const DATA_BASE = "data2/";
      const APP_TIME_ZONE = "Europe/Berlin";
      const FORECAST_MIN_DATE_STR = "2026-04-02";
      const BRAND_FORECAST_WEIGHT = 0.22;
      const BRAND_FORECAST_ORIENTATION_WEIGHT = 0.08;
      const BRAND_FORECAST_CORRECTION_CAP = 0.025;
      let priceLevelChart = null;
      let forecastChart = null;
      const managementSummaryCache = new Map();

      const fuelLabels = {
        diesel: "Diesel",
        e10: "E10",
        e5: "E5",
      };

      document.title = `Tankzeit | ${stationName}`;
      document.getElementById("station-name").textContent = stationName;
      document.getElementById("station-fuel").textContent =
        fuelLabels[fuel] || fuel.toUpperCase();

      const metaParts = [];
      if (stationId) metaParts.push(`ID ${stationId}`);
      metaParts.push(`${fuelLabels[fuel] || fuel.toUpperCase()} Detailansicht`);
      document.getElementById("station-meta").textContent = metaParts.join(" - ");

      const backLink = document.getElementById("back-link");
      if (fuel === "e10") {
        backLink.href = "e10.html";
        backLink.textContent = "Zurück zu E10";
      } else {
        backLink.href = "index.html";
        backLink.textContent = "Zurück zu Diesel";
      }

      const mapsLink = document.getElementById("maps-link");
      if (lat && lng) {
        mapsLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(
          `${lat},${lng}`,
        )}`;
      } else {
        mapsLink.removeAttribute("href");
        mapsLink.setAttribute("aria-disabled", "true");
        mapsLink.textContent = "Google Maps nicht verfügbar";
      }

      function stationPath(station) {
        return station.split("-").join("/");
      }

      function formatDate(dateValue) {
        const [year, month, day] = String(dateValue || "").split("-");
        if (!year || !month || !day) return String(dateValue || "");
        return `${day}.${month}.${year}`;
      }

      function berlinDateParts(now = new Date()) {
        const formatter = new Intl.DateTimeFormat("en-CA", {
          timeZone: APP_TIME_ZONE,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        });
        const parts = Object.create(null);
        formatter.formatToParts(now).forEach((part) => {
          if (part.type !== "literal") {
            parts[part.type] = part.value;
          }
        });
        return {
          y: parts.year,
          m: parts.month,
          d: parts.day,
        };
      }

      function parseISODate(value) {
        const [y, m, d] = value.split("-").map((x) => parseInt(x, 10));
        return new Date(Date.UTC(y, m - 1, d));
      }

      function berlinToday() {
        const parts = berlinDateParts();
        return parseISODate(`${parts.y}-${parts.m}-${parts.d}`);
      }

      function addDays(date, days) {
        const next = new Date(date.getTime());
        next.setUTCDate(next.getUTCDate() + days);
        return next;
      }

      function forecastTargetDate() {
        return addDays(berlinToday(), 1);
      }

      function formatLongDate(date) {
        const day = String(date.getUTCDate()).padStart(2, "0");
        const month = String(date.getUTCMonth() + 1).padStart(2, "0");
        const year = date.getUTCFullYear();
        return `${day}.${month}.${year}`;
      }

      function formatISODate(date) {
        const year = date.getUTCFullYear();
        const month = String(date.getUTCMonth() + 1).padStart(2, "0");
        const day = String(date.getUTCDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function dateParts(date) {
        return {
          y: String(date.getUTCFullYear()),
          m: String(date.getUTCMonth() + 1).padStart(2, "0"),
          d: String(date.getUTCDate()).padStart(2, "0"),
        };
      }

      function selectedRangeLabel(range) {
        if (!range?.from || !range?.to) return "";
        return `${formatDate(range.from)} bis ${formatDate(range.to)}`;
      }

      function updateChartHeadings(range) {
        const fuelName = fuelLabels[fuel] || fuel.toUpperCase();
        const period = selectedRangeLabel(range);
        const suffix = period ? ` · ${fuelName} · ${period}` : ` · ${fuelName}`;
        document.getElementById("price-level-heading").textContent =
          `Preisniveau 12:00 Uhr bis 12:00 Uhr${suffix}`;
        document.getElementById("forecast-heading").textContent =
          `Prognose \u00b7 ${fuelName} \u00b7 ${formatLongDate(forecastTargetDate())}`;
      }

      function rangeHourTicks(dayCount) {
        if (dayCount <= 3) return [12, 16, 20, 0, 4, 8, 12];
        if (dayCount <= 7) return [12, 18, 0, 6, 12];
        return [12, 0, 12];
      }

      function axisProfileForRows(rows) {
        const noonIndexes = rows
          .map((row, index) => (row.clockHour === 12 ? index : -1))
          .filter((index) => index >= 0);
        const dayCount = Math.max(1, noonIndexes.length - 1);
        const condensedRangeAxis = dayCount > 20;
        const visibleTickIndexes = new Set();
        const labelTickIndexes = new Set();
        const hourTicks = condensedRangeAxis ? [12] : rangeHourTicks(dayCount);

        rows.forEach((row, index) => {
          if (!hourTicks.includes(row.clockHour)) return;
          visibleTickIndexes.add(index);
          if (
            !condensedRangeAxis ||
            row.clockHour !== 12 ||
            noonIndexes.indexOf(index) % 2 === 0 ||
            index === noonIndexes[noonIndexes.length - 1]
          ) {
            labelTickIndexes.add(index);
          }
        });

        const midnightIndexes = condensedRangeAxis
          ? []
          : rows
              .map((row, index) => (row.clockHour === 0 ? index : -1))
              .filter((index) => index >= 0);

        return {
          visibleTickIndexes,
          labelTickIndexes,
          midnightIndexes,
        };
      }

      function formatAxisTickLabel(row) {
        if (!row) return "";
        const hourLabel = String(row.clockHour).padStart(2, "0");
        if (row.clockHour === 12 && row.date) {
          return [formatDate(row.date).slice(0, 5), hourLabel];
        }
        return ["", hourLabel];
      }

      function formatFuelPrice(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount)) return "-";
        return new Intl.NumberFormat("de-DE", {
          minimumFractionDigits: 3,
          maximumFractionDigits: 3,
        }).format(amount);
      }

      function formatEuroTick(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount)) return "-";
        return new Intl.NumberFormat("de-DE", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(amount);
      }

      function priceLevelDomain(values) {
        const finiteValues = values.filter((value) => Number.isFinite(value));
        if (!finiteValues.length) return { min: 1.5, max: 2.5 };
        const min = Math.min(...finiteValues);
        const max = Math.max(...finiteValues);
        if (Math.abs(max - min) < 0.0005) {
          const pad = Math.max(0.02, Math.abs(max || 1) * 0.01);
          return { min: min - pad, max: max + pad };
        }
        const pad = Math.max(0.02, (max - min) * 0.12);
        return { min: min - pad, max: max + pad };
      }

      function quantile(sortedValues, q) {
        if (!sortedValues.length) return null;
        const pos = (sortedValues.length - 1) * q;
        const base = Math.floor(pos);
        const rest = pos - base;
        const next = sortedValues[base + 1];
        if (next === undefined) return sortedValues[base];
        return sortedValues[base] + rest * (next - sortedValues[base]);
      }

      function median(values) {
        const sorted = values
          .filter((value) => Number.isFinite(value))
          .sort((left, right) => left - right);
        return quantile(sorted, 0.5);
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function normalizeBrandName(value) {
        return String(value || "").trim().toUpperCase();
      }

      function currentChartTheme() {
        const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        return isDark
          ? {
              axisLabel: "rgba(237, 244, 243, 0.74)",
              axisTitle: "rgba(237, 244, 243, 0.74)",
              grid: "rgba(148, 163, 184, 0.18)",
              border: "rgba(148, 163, 184, 0.34)",
              tooltipBackground: "rgba(9, 14, 17, 0.96)",
            }
          : {
              axisLabel: "rgba(0, 0, 0, 0.55)",
              axisTitle: "rgba(0, 0, 0, 0.55)",
              grid: "rgba(0, 0, 0, 0.08)",
              border: "rgba(0, 0, 0, 0.18)",
              tooltipBackground: "rgba(17, 24, 39, 0.94)",
            };
      }

      function applyChartTheme(options) {
        const theme = currentChartTheme();
        const scales = options.scales || {};
        Object.values(scales).forEach((scale) => {
          scale.ticks = {
            color: theme.axisLabel,
            ...(scale.ticks || {}),
          };
          scale.title = {
            color: theme.axisTitle,
            ...(scale.title || {}),
          };
          scale.grid = {
            color: theme.grid,
            ...(scale.grid || {}),
          };
          scale.border = {
            color: theme.border,
            ...(scale.border || {}),
          };
        });
        options.scales = scales;
        options.layout = {
          padding: {
            top: 8,
            right: 10,
            bottom: 0,
            left: 4,
          },
          ...(options.layout || {}),
        };
        options.plugins = {
          ...(options.plugins || {}),
          tooltip: {
            backgroundColor: theme.tooltipBackground,
            titleColor: "#f8fafc",
            bodyColor: "#f8fafc",
            borderColor: "rgba(255,255,255,0.14)",
            borderWidth: 1,
            ...(options.plugins?.tooltip || {}),
          },
          legend: {
            labels: { color: theme.axisTitle },
            ...(options.plugins?.legend || {}),
          },
        };
        return options;
      }

      function chartPixelRatio() {
        return Math.max(2, Math.min(3, Math.ceil(window.devicePixelRatio || 1)));
      }

      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return response.json();
      }

      async function fetchText(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return response.text();
      }

      function managementUrlForDay(day) {
        const parts = dateParts(parseISODate(day));
        return `${DATA_BASE}${parts.y}/${parts.m}/${parts.d}/management_boxplots.json`;
      }

      async function fetchManagementSummary(day) {
        if (!day) return null;
        if (managementSummaryCache.has(day)) return managementSummaryCache.get(day);
        try {
          const summary = await fetchJson(managementUrlForDay(day));
          managementSummaryCache.set(day, summary);
          return summary;
        } catch {
          managementSummaryCache.set(day, null);
          return null;
        }
      }

      function parseCsv(text) {
        const lines = text
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean);
        if (!lines.length) return [];
        const headers = lines[0].split(",").map((header) => header.trim());
        return lines.slice(1).map((line) => {
          const values = line.split(",");
          const row = {};
          headers.forEach((header, index) => {
            row[header] = values[index] ?? "";
          });
          return row;
        });
      }

      function waitForChartJs() {
        return new Promise((resolve) => {
          if (typeof Chart !== "undefined") {
            resolve();
            return;
          }
          const timer = window.setInterval(() => {
            if (typeof Chart !== "undefined") {
              window.clearInterval(timer);
              resolve();
            }
          }, 50);
        });
      }

      function normalizePriceRows(stats) {
        const rows = Array.isArray(stats?.cycle_hourly) ? stats.cycle_hourly : [];
        return rows
          .map((row) => {
            const cycleHour = Number(row?.cycle_hour);
            const clockHour = Number(
              row?.clock_hour != null ? row.clock_hour : row?.label,
            );
            const priceCandidates = [
              row?.price_median,
              row?.price_avg,
              row?.price_min,
              row?.price_max,
            ];
            let price = null;
            for (const candidate of priceCandidates) {
              const numeric = Number(candidate);
              if (Number.isFinite(numeric)) {
                price = numeric;
                break;
              }
            }
            if (!Number.isFinite(cycleHour) || !Number.isFinite(clockHour) || price === null) {
              return null;
            }
            const normalizedClockHour = ((Math.round(clockHour) % 24) + 24) % 24;
            return {
              cycleHour,
              clockHour: normalizedClockHour,
              label:
                typeof row?.label === "string" && row.label.trim()
                  ? row.label.trim()
                  : String(normalizedClockHour).padStart(2, "0"),
              price,
              count: Number(row?.count) || 0,
            };
          })
          .filter((row) => row !== null)
          .sort((left, right) => left.cycleHour - right.cycleHour);
      }

      function normalizeHistoryRows(rows) {
        return rows
          .map((row) => {
            const price = Number(row?.price);
            const date = String(row?.date || "");
            if (!date || !Number.isFinite(price)) return null;
            return { date, price };
          })
          .filter((row) => row !== null)
          .sort((left, right) => left.date.localeCompare(right.date));
      }

      function findHistoryPrice(historyRows, day) {
        const match = historyRows.find((row) => row.date === day);
        return match ? match.price : null;
      }

      function shiftIsoDay(day, offsetDays) {
        const [year, month, date] = String(day || "")
          .split("-")
          .map((part) => Number(part));
        if (
          !Number.isInteger(year) ||
          !Number.isInteger(month) ||
          !Number.isInteger(date)
        ) {
          return "";
        }
        const shifted = new Date(Date.UTC(year, month - 1, date + offsetDays));
        return shifted.toISOString().slice(0, 10);
      }

      function previousDay(day) {
        return shiftIsoDay(day, -1);
      }

      function nextDay(day) {
        return shiftIsoDay(day, 1);
      }

      function eachCycleStartDay(fromDay, toDay) {
        const days = [];
        let currentDay = fromDay;
        let guard = 0;
        const endDay = fromDay === toDay ? nextDay(toDay) : toDay;
        while (currentDay && currentDay < endDay && guard < 370) {
          days.push(currentDay);
          currentDay = nextDay(currentDay);
          guard += 1;
        }
        return days;
      }

      async function loadBrandMarketDays(selectedRange, brandName) {
        const normalizedBrand = normalizeBrandName(brandName);
        if (!normalizedBrand || !selectedRange?.from || !selectedRange?.to) {
          return { brand: normalizedBrand, byDay: new Map() };
        }

        const fromDay = selectedRange.from < FORECAST_MIN_DATE_STR
          ? FORECAST_MIN_DATE_STR
          : selectedRange.from;
        const days = eachCycleStartDay(fromDay, selectedRange.to);
        const requestedDays = Array.from(new Set([previousDay(days[0]), ...days].filter(Boolean)));
        const summaries = await Promise.all(
          requestedDays.map(async (day) => ({
            day,
            summary: await fetchManagementSummary(day),
          })),
        );

        return {
          brand: normalizedBrand,
          byDay: new Map(
            summaries
              .filter((entry) => entry.summary)
              .map((entry) => [entry.day, entry.summary]),
          ),
        };
      }

      function brandRowsForSummary(summary) {
        return Array.isArray(summary?.brand_distributions?.[fuel])
          ? summary.brand_distributions[fuel]
          : [];
      }

      function findBrandRow(summary, brandName) {
        const normalizedBrand = normalizeBrandName(brandName);
        if (!normalizedBrand) return null;
        return brandRowsForSummary(summary).find(
          (row) => normalizeBrandName(row?.brand) === normalizedBrand,
        );
      }

      function overallMarketRow(summary) {
        return brandRowsForSummary(summary).find(
          (row) => normalizeBrandName(row?.brand) === "GESAMTMARKT",
        );
      }

      function marketGroupMedian(summary, group) {
        const rows = brandRowsForSummary(summary)
          .filter((row) => {
            const brand = normalizeBrandName(row?.brand);
            return brand && brand !== "GESAMTMARKT" && brand !== "MISC";
          })
          .map((row) => Number(row?.median))
          .filter((value) => Number.isFinite(value))
          .sort((left, right) => left - right);
        if (!rows.length) return null;
        const sample = group === "high" ? rows.slice(-3) : rows.slice(0, 3);
        return median(sample);
      }

      function brandMarketCorrection(day, referencePrice, brandMarket) {
        if (!brandMarket?.brand || !brandMarket.byDay?.size) return 0;
        const summary = brandMarket.byDay.get(day);
        const brandRow = findBrandRow(summary, brandMarket.brand);
        const overall = overallMarketRow(summary);
        const brandMedian = Number(brandRow?.median);
        const overallMedian = Number(overall?.median);
        if (
          !Number.isFinite(referencePrice) ||
          !Number.isFinite(brandMedian) ||
          !Number.isFinite(overallMedian)
        ) {
          return 0;
        }

        const stationPremium = referencePrice - overallMedian;
        const brandPremium = brandMedian - overallMedian;
        let correction = (brandPremium - stationPremium) * BRAND_FORECAST_WEIGHT;

        const previousSummary = brandMarket.byDay.get(previousDay(day));
        const previousOverall = overallMarketRow(previousSummary);
        const previousBrand = findBrandRow(previousSummary, brandMarket.brand);
        const previousOverallMedian = Number(previousOverall?.median);
        const previousBrandMedian = Number(previousBrand?.median);
        const marketMove = overallMedian - previousOverallMedian;
        const brandMove = brandMedian - previousBrandMedian;

        if (
          Number.isFinite(marketMove) &&
          Number.isFinite(brandMove) &&
          Math.abs(marketMove) >= 0.03
        ) {
          const highMedian = marketGroupMedian(summary, "high");
          const lowMedian = marketGroupMedian(summary, "low");
          const previousHighMedian = marketGroupMedian(previousSummary, "high");
          const previousLowMedian = marketGroupMedian(previousSummary, "low");
          const highMove = highMedian - previousHighMedian;
          const lowMove = lowMedian - previousLowMedian;
          const spread = highMedian - lowMedian;

          if (
            Number.isFinite(highMove) &&
            Number.isFinite(lowMove) &&
            Number.isFinite(spread) &&
            spread > 0
          ) {
            const distanceToHigh = Math.abs(brandMove - highMove);
            const distanceToLow = Math.abs(brandMove - lowMove);
            const orientation =
              (distanceToLow - distanceToHigh) /
              Math.max(0.001, distanceToLow + distanceToHigh);
            correction += orientation * spread * BRAND_FORECAST_ORIENTATION_WEIGHT;
          }
        }

        return clamp(
          correction,
          -BRAND_FORECAST_CORRECTION_CAP,
          BRAND_FORECAST_CORRECTION_CAP,
        );
      }

      function normalizeFallbackPriceRows(stats, historyRows, selectedRange) {
        const hourlyRows = Array.isArray(stats?.hourly) ? stats.hourly : [];
        if (!hourlyRows.length || !historyRows.length) return { rows: [], summary: null };

        const firstHistoryDay = historyRows[0]?.date || "";
        const lastHistoryDay = historyRows[historyRows.length - 1]?.date || "";
        const fromDay = selectedRange?.from || firstHistoryDay;
        const toDay = selectedRange?.to || lastHistoryDay;
        const cycleStartDays = eachCycleStartDay(fromDay, toDay);
        if (!cycleStartDays.length) return { rows: [], summary: null };

        const byHour = new Map();
        hourlyRows.forEach((row) => {
          const hour = Number(row?.hour);
          const delta = Number(row?.price);
          if (Number.isFinite(hour) && Number.isFinite(delta)) {
            byHour.set(Math.round(hour), delta);
          }
        });

        const rows = [];
        cycleStartDays.forEach((day, dayIndex) => {
          const referencePrice = findHistoryPrice(historyRows, day);
          const closingPrice =
            findHistoryPrice(historyRows, nextDay(day)) ?? referencePrice;
          if (!Number.isFinite(referencePrice)) {
            return;
          }

          for (let cycleHour = 0; cycleHour <= 24; cycleHour += 1) {
            if (dayIndex > 0 && cycleHour === 0) continue;
            const clockHour = (12 + cycleHour) % 24;
            const sourceHour = cycleHour === 24 ? 12 : clockHour;
            const delta = byHour.get(sourceHour);
            if (!Number.isFinite(delta)) continue;
            const price =
              cycleHour === 0
                ? referencePrice
                : cycleHour === 24
                  ? closingPrice
                  : referencePrice + delta;
            const date = cycleHour < 12 ? day : nextDay(day);
            rows.push({
              cycleHour: rows.length,
              clockHour,
              date,
              label:
                clockHour === 12
                  ? `${formatDate(date).slice(0, 5)} 12:00 Uhr`
                  : `${String(clockHour).padStart(2, "0")}:00`,
              price: Number(price.toFixed(3)),
              count: 1,
            });
          }
        });

        return {
          rows,
          summary: {
            cycle_start: firstHistoryDay,
            cycle_end: lastHistoryDay,
            fallback: true,
          },
        };
      }

      function stationForecastSeries(stats, historyRows, selectedRange, brandMarket = null) {
        const hourlyRows = Array.isArray(stats?.hourly) ? stats.hourly : [];
        if (!hourlyRows.length || !historyRows.length) {
          return { rows: [], sourceDays: [], baseDate: null, baseMedian: null };
        }

        const requestedFromDay = selectedRange?.from || historyRows[0]?.date || "";
        const fromDay = requestedFromDay && requestedFromDay < FORECAST_MIN_DATE_STR
          ? FORECAST_MIN_DATE_STR
          : requestedFromDay;
        const toDay = selectedRange?.to || historyRows[historyRows.length - 1]?.date || "";
        const sourceDays = eachCycleStartDay(fromDay, toDay)
          .map((day) => ({
            day,
            referencePrice: findHistoryPrice(historyRows, day),
            closingPrice: findHistoryPrice(historyRows, nextDay(day)),
          }))
          .filter((day) => Number.isFinite(day.referencePrice));

        if (!sourceDays.length) {
          return { rows: [], sourceDays: [], baseDate: null, baseMedian: null };
        }

        const byHour = new Map();
        hourlyRows.forEach((row) => {
          const hour = Number(row?.hour);
          const delta = Number(row?.price);
          if (Number.isFinite(hour) && Number.isFinite(delta)) {
            byHour.set(Math.round(hour), delta);
          }
        });

        const baseSourceDay = sourceDays[sourceDays.length - 1];
        const baseMedian = Number(baseSourceDay.referencePrice);
        const buckets = Array.from({ length: 25 }, (_, cycleHour) => {
          const clockHour = (12 + cycleHour) % 24;
          return {
            hour: cycleHour,
            clockHour,
            label: String(clockHour).padStart(2, "0"),
            prices: [],
          };
        });
        let brandCorrectionApplied = false;

        sourceDays.forEach(({ day, referencePrice, closingPrice }) => {
          const brandCorrection = brandMarketCorrection(day, referencePrice, brandMarket);
          if (Math.abs(brandCorrection) > 0.0005) brandCorrectionApplied = true;
          buckets.forEach((bucket) => {
            const sourceHour = bucket.hour === 24 ? 12 : bucket.clockHour;
            const delta = byHour.get(sourceHour);
            if (!Number.isFinite(delta)) return;
            const brandCorrectionShare = bucket.hour / 24;
            const price =
              bucket.hour === 0
                ? referencePrice
                : bucket.hour === 24 && Number.isFinite(closingPrice)
                  ? closingPrice
                  : referencePrice + delta;
            if (Number.isFinite(price)) {
              bucket.prices.push(price + brandCorrection * brandCorrectionShare);
            }
          });
        });

        const rows = buckets
          .map((bucket) => {
            const sorted = bucket.prices.sort((left, right) => left - right);
            const rowMedian = quantile(sorted, 0.5);
            const q1 = quantile(sorted, 0.25);
            const q3 = quantile(sorted, 0.75);
            if (!Number.isFinite(rowMedian)) return null;
            return {
              ...bucket,
              median: Number(rowMedian.toFixed(3)),
              q1: Number((Number.isFinite(q1) ? q1 : rowMedian).toFixed(3)),
              q3: Number((Number.isFinite(q3) ? q3 : rowMedian).toFixed(3)),
            };
          })
          .filter(Boolean);

        return {
          rows,
          sourceDays,
          baseDate: baseSourceDay.day,
          baseMedian,
          brandAdjusted: brandCorrectionApplied,
        };
      }

      function updateRangeControls(summary) {
        const fromInput = document.getElementById("cycle-from");
        const toInput = document.getElementById("cycle-to");
        const cycleStart = summary?.cycle_start || "";
        const cycleEnd = summary?.cycle_end || "";
        if (!cycleStart || !cycleEnd) {
          fromInput.disabled = true;
          toInput.disabled = true;
          return { from: "", to: "" };
        }

        fromInput.min = cycleStart;
        fromInput.max = cycleEnd;
        toInput.min = cycleStart;
        toInput.max = cycleEnd;
        const requestedFrom = params.get("from") || cycleStart;
        const requestedTo = params.get("to") || cycleEnd;
        fromInput.value =
          requestedFrom >= cycleStart && requestedFrom <= cycleEnd
            ? requestedFrom
            : cycleStart;
        toInput.value =
          requestedTo >= cycleStart && requestedTo <= cycleEnd
            ? requestedTo
            : cycleEnd;
        if (fromInput.value > toInput.value) {
          fromInput.value = toInput.value;
        }
        fromInput.disabled = false;
        toInput.disabled = false;
        return { from: fromInput.value, to: toInput.value };
      }

      function updateRangeInUrl() {
        const fromInput = document.getElementById("cycle-from");
        const toInput = document.getElementById("cycle-to");
        if (fromInput.value) params.set("from", fromInput.value);
        if (toInput.value) params.set("to", toInput.value);
        window.history.replaceState(
          {},
          "",
          `${window.location.pathname}?${params.toString()}`,
        );
      }

      function applySelectedRange() {
        updateRangeInUrl();
        loadPriceLevelChart();
      }

      function clearPriceLevelChart() {
        if (priceLevelChart) {
          priceLevelChart.destroy();
          priceLevelChart = null;
        }
      }

      function clearForecastChart() {
        if (forecastChart) {
          forecastChart.destroy();
          forecastChart = null;
        }
      }

      function fallbackForecastRows() {
        return Array.from({ length: 25 }, (_, index) => {
          const clockHour = (12 + index) % 24;
          return {
            label: `${String(clockHour).padStart(2, "0")}:00`,
            price: null,
            hour: index,
            clockHour,
            date: "",
          };
        });
      }

      function renderForecastChart(series) {
        const chartRows = series?.rows?.length ? series.rows : fallbackForecastRows();
        const stepPointsFor = (valueKey) => {
          const points = [];
          chartRows.forEach((row, index) => {
            const value = row[valueKey] ?? null;
            points.push({
              x: row.hour,
              y: value,
              sourceRowIndex: index,
              isHourPoint: true,
            });
            const nextRow = chartRows[index + 1];
            if (nextRow) {
              points.push({
                x: nextRow.hour,
                y: value,
                sourceRowIndex: index,
                isHourPoint: false,
              });
            }
          });
          return points;
        };
        const values = chartRows.flatMap((row) => [row.median, row.q1, row.q3]);
        const domain = priceLevelDomain(values);
        const ctx = document.getElementById("forecast-chart").getContext("2d");
        if (forecastChart) forecastChart.destroy();
        forecastChart = new Chart(ctx, {
          type: "line",
          data: {
            datasets: [
              {
                label: "q3",
                data: stepPointsFor("q3"),
                borderColor: "rgba(15, 118, 110, 0)",
                backgroundColor: "rgba(15, 118, 110, 0)",
                pointRadius: 0,
                tension: 0,
              },
              {
                label: "Typischer Bereich q1-q3",
                data: stepPointsFor("q1"),
                borderColor: "rgba(15, 118, 110, 0)",
                backgroundColor: "rgba(15, 118, 110, 0.14)",
                pointRadius: 0,
                fill: false,
                tension: 0,
              },
              {
                label: "Prognose Median",
                data: stepPointsFor("median"),
                borderColor: "#0f766e",
                backgroundColor: "#0f766e",
                borderWidth: 2.4,
                pointRadius(context) {
                  return context.raw?.isHourPoint ? 2.5 : 0;
                },
                pointHoverRadius: 4,
                tension: 0,
                fill: false,
              },
            ],
          },
          options: applyChartTheme({
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            devicePixelRatio: chartPixelRatio(),
            scales: {
              x: {
                type: "linear",
                alignToPixels: true,
                min: 0,
                max: 24,
                grid: {
                  color(context) {
                    return context.tick.value % 4 === 0
                      ? currentChartTheme().grid
                      : "rgba(0, 0, 0, 0)";
                  },
                  lineWidth(context) {
                    return context.tick.value % 4 === 0 ? 1 : 0;
                  },
                },
                title: {
                  display: true,
                  text: "Stunde im 12:00 Uhr-12:00 Uhr-Zyklus",
                  font: {
                    size: 12,
                    weight: "700",
                  },
                },
                ticks: {
                  autoSkip: false,
                  stepSize: 1,
                  maxRotation: 0,
                  minRotation: 0,
                  padding: 8,
                  font: {
                    size: 11,
                    weight: "700",
                  },
                  callback(value, index) {
                    const row = chartRows.find((candidate) => candidate.hour === value);
                    return row?.label || "";
                  },
                },
              },
              y: {
                alignToPixels: true,
                min: domain.min,
                max: domain.max,
                grid: {
                  lineWidth: 1,
                },
                ticks: {
                  padding: 8,
                  font: {
                    size: 11,
                    weight: "700",
                  },
                  callback(value) {
                    return formatEuroTick(value);
                  },
                },
                title: {
                  display: true,
                  text: "Preis (EUR/l)",
                  font: {
                    size: 12,
                    weight: "700",
                  },
                },
              },
            },
            plugins: {
              legend: {
                display: true,
                position: "top",
                align: "end",
                labels: {
                  filter(item) {
                    return item.text !== "q3";
                  },
                  usePointStyle: false,
                  boxWidth: 22,
                },
              },
              tooltip: {
                callbacks: {
                  label(context) {
                    const rowIndex = context.raw?.sourceRowIndex ?? context.dataIndex;
                    const row = chartRows[rowIndex];
                    if (!row || context.dataset.label === "q3") return "";
                    if (context.dataset.label === "Typischer Bereich q1-q3") {
                      return `q1-q3: ${formatFuelPrice(row.q1)} bis ${formatFuelPrice(row.q3)} EUR/l`;
                    }
                    return `Prognose-Median: ${formatFuelPrice(row.median)} EUR/l`;
                  },
                },
              },
            },
          }),
          plugins: [
            {
              id: "stationForecastQuartileBand",
              beforeDatasetsDraw(chart) {
                const xScale = chart.scales.x;
                const yScale = chart.scales.y;
                const chartArea = chart.chartArea;
                if (!xScale || !yScale || !chartArea) return;
                const { ctx } = chart;
                ctx.save();
                ctx.fillStyle = "rgba(15, 118, 110, 0.14)";
                for (let index = 0; index < chartRows.length - 1; index++) {
                  const row = chartRows[index];
                  const nextRow = chartRows[index + 1];
                  const q1 = Number(row.q1);
                  const q3 = Number(row.q3);
                  if (
                    !Number.isFinite(q1) ||
                    !Number.isFinite(q3) ||
                    !Number.isFinite(row.hour) ||
                    !Number.isFinite(nextRow.hour)
                  ) {
                    continue;
                  }
                  const x1 = xScale.getPixelForValue(row.hour);
                  const x2 = xScale.getPixelForValue(nextRow.hour);
                  const y1 = yScale.getPixelForValue(q1);
                  const y3 = yScale.getPixelForValue(q3);
                  ctx.beginPath();
                  ctx.rect(
                    Math.min(x1, x2),
                    Math.min(y1, y3),
                    Math.abs(x2 - x1),
                    Math.abs(y3 - y1),
                  );
                  ctx.fill();
                }
                ctx.restore();
              },
            },
            {
              id: "stationForecastMidnightDivider",
              afterDraw(chart) {
                const xScale = chart.scales.x;
                const chartArea = chart.chartArea;
                if (!xScale || !chartArea) return;
                const { ctx } = chart;
                const midnightIndex = chartRows.findIndex((row) => row.clockHour === 0);
                if (midnightIndex < 0) return;
                const dividerX = xScale.getPixelForValue(midnightIndex);
                ctx.save();
                ctx.setLineDash([6, 4]);
                ctx.strokeStyle = "rgba(37, 99, 235, 0.34)";
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(dividerX, chartArea.top);
                ctx.lineTo(dividerX, chartArea.bottom);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = "rgba(37, 99, 235, 0.78)";
                ctx.font = "11px Manrope, sans-serif";
                ctx.fillText("00:00", dividerX + 6, chartArea.top + 14);
                ctx.restore();
              },
            },
          ],
        });
      }

      function renderPriceLevelChart(rows) {
        const labels = rows.map((row) => row.label);
        const values = rows.map((row) => row.price);
        const domain = priceLevelDomain(values);
        const {
          visibleTickIndexes,
          labelTickIndexes,
          midnightIndexes,
        } = axisProfileForRows(rows);
        const ctx = document.getElementById("price-level-chart").getContext("2d");
        if (priceLevelChart) priceLevelChart.destroy();
        priceLevelChart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: `${fuelLabels[fuel] || fuel.toUpperCase()} Preisniveau`,
                data: values,
                borderColor: "#0f766e",
                backgroundColor: "rgba(15, 118, 110, 0.14)",
                borderWidth: 2.4,
                borderJoinStyle: "round",
                borderCapStyle: "round",
                pointRadius: rows.length > 96 ? 0 : 2,
                pointHoverRadius: 4,
                stepped: "before",
                tension: 0,
                fill: true,
              },
            ],
          },
          options: applyChartTheme({
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            devicePixelRatio: chartPixelRatio(),
            interaction: {
              mode: "index",
              intersect: false,
            },
            scales: {
              x: {
                alignToPixels: true,
                grid: {
                  color(context) {
                    return visibleTickIndexes.has(context.index)
                      ? currentChartTheme().grid
                      : "rgba(0, 0, 0, 0)";
                  },
                  lineWidth(context) {
                    return visibleTickIndexes.has(context.index) ? 1 : 0;
                  },
                },
                title: {
                  display: true,
                  text: "Zeitachse 12:00 Uhr bis 12:00 Uhr",
                  font: {
                    size: 12,
                    weight: "700",
                  },
                },
                ticks: {
                  autoSkip: false,
                  maxRotation: 0,
                  minRotation: 0,
                  padding: 8,
                  font: {
                    size: 11,
                    weight: "700",
                  },
                  callback(value, index) {
                    if (!labelTickIndexes.has(index)) return "";
                    const row = rows[index];
                    return formatAxisTickLabel(row);
                  },
                },
              },
              y: {
                alignToPixels: true,
                min: domain.min,
                max: domain.max,
                grid: {
                  lineWidth: 1,
                },
                ticks: {
                  padding: 8,
                  font: {
                    size: 11,
                    weight: "700",
                  },
                  callback(value) {
                    return formatEuroTick(value);
                  },
                },
                title: {
                  display: true,
                  text: "Preis (EUR/l)",
                  font: {
                    size: 12,
                    weight: "700",
                  },
                },
              },
            },
            plugins: {
              legend: {
                display: true,
                position: "top",
                align: "end",
                labels: {
                  usePointStyle: false,
                  boxWidth: 22,
                },
              },
              tooltip: {
                callbacks: {
                  label(context) {
                    const row = rows[context.dataIndex];
                    if (!row) return "";
                    return `${formatFuelPrice(row.price)} EUR/l`;
                  },
                  afterBody(context) {
                    const row = rows[context[0]?.dataIndex];
                    if (!row) return [];
                    const lines = [
                      row.date
                        ? `Zeit: ${formatDate(row.date)} ${String(row.clockHour).padStart(2, "0")}:00`
                        : `Uhrzeit: ${row.label}`,
                    ];
                    if (row.count) lines.push(`Zyklen: ${row.count}`);
                    return lines;
                  },
                },
              },
            },
          }),
          plugins: [
            {
              id: "stationDetailMidnightDivider",
              afterDraw(chart) {
                if (!midnightIndexes.length) return;
                const xScale = chart.scales.x;
                const chartArea = chart.chartArea;
                if (!xScale || !chartArea) return;
                const { ctx } = chart;
                ctx.save();
                midnightIndexes.forEach((midnightIndex) => {
                  const dividerX = xScale.getPixelForValue(midnightIndex);
                  ctx.setLineDash([6, 4]);
                  ctx.strokeStyle = "rgba(37, 99, 235, 0.34)";
                  ctx.lineWidth = 1.2;
                  ctx.beginPath();
                  ctx.moveTo(dividerX, chartArea.top);
                  ctx.lineTo(dividerX, chartArea.bottom);
                  ctx.stroke();
                  ctx.setLineDash([]);
                });
                ctx.restore();
              },
            },
          ],
        });
      }

      async function loadPriceLevelChart() {
        const note = document.getElementById("price-level-note");
        const forecastNote = document.getElementById("forecast-note");
        if (!stationId) {
          clearForecastChart();
          note.textContent = "Keine Station ausgewaehlt.";
          forecastNote.textContent = "";
          return;
        }
        try {
          await waitForChartJs();
          const stats = await fetchJson(`${DATA_BASE}${stationPath(stationId)}/${fuel}.json`);
          const historyText = await fetchText(
            `${DATA_BASE}${stationPath(stationId)}/${fuel}/history.csv`,
          );
          const historyRows = normalizeHistoryRows(parseCsv(historyText));
          const historySummary = {
            cycle_start: historyRows[0]?.date || "",
            cycle_end: historyRows[historyRows.length - 1]?.date || "",
          };
          const selectedRange = updateRangeControls(historySummary);
          let rows = normalizePriceRows(stats);
          let isFallback = false;
          const fallback = normalizeFallbackPriceRows(
            stats,
            historyRows,
            selectedRange,
          );
          if (fallback.rows.length) {
            rows = fallback.rows;
            isFallback = true;
          }
          updateChartHeadings(selectedRange);
          if (!rows.length) {
            clearPriceLevelChart();
            renderForecastChart({ rows: [] });
            note.textContent = "Für diese Station liegt noch kein Preisniveau von 12:00 Uhr bis 12:00 Uhr vor.";
            forecastNote.textContent = "Keine Prognose verfügbar: Für diese Station liegen noch nicht genug Stationsdaten vor.";
            return;
          }
          renderPriceLevelChart(rows);
          const brandMarket = await loadBrandMarketDays(selectedRange, stationBrand);
          const forecast = stationForecastSeries(
            stats,
            historyRows,
            selectedRange,
            brandMarket,
          );
          renderForecastChart(forecast);
          const availableStart = selectedRange.from;
          const availableEnd = selectedRange.to;
          note.textContent = `${fuelLabels[fuel] || fuel.toUpperCase()} - 12:00 Uhr bis 12:00 Uhr - ${formatDate(
            availableStart,
          )} bis ${formatDate(availableEnd)}${
            isFallback ? " - aus Tagesprofil und Mittagspreisen abgeleitet" : ""
          }`;
          if (forecast.rows.length) {
            const sourceStart = forecast.sourceDays[0]?.day || selectedRange.from;
            const sourceEnd = forecast.sourceDays[forecast.sourceDays.length - 1]?.day || selectedRange.to;
            const brandContext = stationBrand
              ? ` Zusätzlich wird die Markenposition von ${stationBrand} gegenüber Gesamtmarkt sowie Hoch- und Niedrigpreisgruppe als vorsichtige statistische Korrektur einbezogen, sofern dafür Marktdaten verfügbar sind.`
              : " Zusätzlich wird, sofern Marktdaten verfügbar sind, die Markenposition gegenüber Gesamtmarkt sowie Hoch- und Niedrigpreisgruppe als vorsichtige statistische Korrektur einbezogen.";
            forecastNote.textContent =
              `Prognosemodell für diese Station: Die Prognose startet preislich vom 12:00-Uhr-Referenzpreis der Station am ${formatDate(forecast.baseDate)} und nutzt den Median des kumulierten 12:00-Uhr-bis-12:00-Uhr-Stationsverlaufs, der ausschließlich aus den Stationsdaten nach der Umstellung ab ${formatDate(FORECAST_MIN_DATE_STR)} gelernt wurde.${brandContext} Dadurch wird die reine Stationshistorie über einen längeren Zeitraum mit marktspezifischen Preisniveau-Unterschieden abgeglichen, damit die kurzfristige Prognose nicht nur den eigenen Verlauf, sondern auch die typische Marktposition der Marke widerspiegelt. Die schattierte Fläche zeigt den typischen Bereich zwischen q1 und q3. Aktuelle Basis: ${formatFuelPrice(forecast.baseMedian)} EUR/l Median; Datengrundlage: ${forecast.sourceDays.length} Tag(e), ${formatDate(sourceStart)} bis ${formatDate(sourceEnd)}. Es handelt sich um eine modellierte Kurzfrist-Prognose auf Basis historischer Stations- und Marktdaten, nicht um gemessene Zukunftspreise.`;
          } else {
            forecastNote.textContent = "Keine Prognose verfügbar: Für diese Station liegen noch nicht genug Stationsdaten vor.";
          }
        } catch (err) {
          note.textContent = "Preisniveau konnte lokal nicht geladen werden.";
          forecastNote.textContent = "Prognose konnte lokal nicht geladen werden.";
        }
      }

      document.getElementById("cycle-range-toggle").addEventListener("click", () => {
        const panel = document.getElementById("cycle-range-panel");
        const toggle = document.getElementById("cycle-range-toggle");
        const shouldOpen = panel.hasAttribute("hidden");
        panel.hidden = !shouldOpen;
        toggle.setAttribute("aria-expanded", String(shouldOpen));
      });
      document.getElementById("cycle-range-apply").addEventListener("click", applySelectedRange);
      document.getElementById("cycle-from").addEventListener("change", updateRangeInUrl);
      document.getElementById("cycle-to").addEventListener("change", updateRangeInUrl);

      loadPriceLevelChart();
    </script>
