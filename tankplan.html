    <style>
      .tankplan-form,.tankplan-fields{display:grid;gap:14px}.tankplan-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.tankplan-field{display:grid;gap:7px}.tankplan-field label{color:var(--muted);font-size:.85rem;font-weight:800}.tankplan-field input{border:1px solid rgba(15,118,110,.18);border-radius:18px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;min-height:52px;padding:0 16px;outline:none}.tankplan-field input:focus{border-color:rgba(15,118,110,.55);box-shadow:0 0 0 4px rgba(15,118,110,.12)}.tankplan-suggestions{display:grid;gap:6px;max-height:280px;overflow:auto}.tankplan-suggestion,.tankplan-selected{border:0;border-radius:20px;background:rgba(15,118,110,.08);color:var(--ink);padding:12px 14px;text-align:left}.tankplan-suggestion{cursor:pointer}.tankplan-suggestion strong,.tankplan-selected strong{display:block}.tankplan-suggestion span,.tankplan-selected span{display:block;color:var(--muted);font-size:.82rem;font-weight:700;margin-top:4px}.tankplan-submit{border:0;border-radius:22px;background:linear-gradient(90deg,#0f766e,#5fb5a7);color:#fff;cursor:pointer;font:inherit;font-weight:900;min-height:56px;padding:0 20px}.tankplan-result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.tankplan-metric{background:rgba(15,118,110,.08);border-radius:18px;padding:14px}.tankplan-metric span,.tankplan-note{color:var(--muted);font-size:.88rem}.tankplan-metric strong{display:block;font-size:1.3rem;margin-top:4px}.tankplan-chart{width:100%;min-width:820px;height:340px;display:block}.tankplan-chart-wrap{overflow-x:auto}.nav-item.active.tankplan{color:#0f766e;background:rgba(15,118,110,.12)}@media(max-width:720px){.tankplan-fields,.tankplan-result-grid{grid-template-columns:1fr}}

  <body>
    <main class="app">
      <header><div class="brand"><h1>Tankplan</h1><p>Fahrzeug auswählen, Restreichweite berechnen und günstige Tankzeit finden</p></div></header>
      <div id="status" class="status">Fahrzeugdaten werden geladen.</div>
      <section class="card">
        <div class="toolbar"><div class="left"><h2>Tankdaten erfassen</h2></div></div>
        <form class="tankplan-form" id="tankplan-form" autocomplete="off">
          <div class="tankplan-fields">
            <div class="tankplan-field"><label for="manufacturer">Hersteller</label><input id="manufacturer" placeholder="z. B. VW" /></div>
            <div class="tankplan-field"><label for="model">Modell</label><input id="model" placeholder="z. B. Golf" /></div>
            <div class="tankplan-field"><label for="driven-km">Gefahrene Kilometer seit letzter Tankfüllung</label><input id="driven-km" inputmode="decimal" required placeholder="z. B. 420" /></div>
            <div class="tankplan-field"><label for="weekly-distance">Fahrtstrecke pro Woche in km</label><input id="weekly-distance" inputmode="decimal" required placeholder="z. B. 250" /></div>
            <div class="tankplan-field"><label for="remaining-range">Restreichweite optional</label><input id="remaining-range" inputmode="decimal" placeholder="z. B. 180" /></div>
          </div>
          <div class="tankplan-suggestions" id="suggestions" hidden></div>
          <div class="tankplan-selected" id="selected-vehicle" hidden><strong id="selected-name"></strong><span id="selected-meta"></span></div>
          <button class="tankplan-submit" type="submit">Anzeigen</button>
        </form>
      </section>
      <section class="card" id="result-card" hidden aria-live="polite"></section>
      <section class="card management-chart-card"><div class="toolbar"><div class="left"><h2>Niedrigste Preise im 24h-Zyklus</h2></div></div><div class="tankplan-chart-wrap"><svg id="cycle-chart" class="tankplan-chart" role="img" aria-label="24 Stunden Zyklus der Kraftstoffpreise"></svg></div><p class="chart-note" id="cycle-note"></p></section>
      <section class="card management-chart-card"><div class="toolbar"><div class="left"><h2>Günstige Tage im Vergleich</h2></div></div><div class="tankplan-chart-wrap"><svg id="day-chart" class="tankplan-chart" role="img" aria-label="Tagesvergleich der Kraftstoffpreise"></svg></div><p class="chart-note" id="day-note"></p></section>
    </main>

      <a href="index.html" class="nav-item diesel"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10c0-4.42-3.58-8-8-8s-8 3.58-8 8c0 6 8 10 8 10z" /></svg><span>Diesel</span></a>

    </nav>
    <script>
      const FUELS=["diesel","e5","e10"],FUEL_LABELS={diesel:"Diesel",e5:"Super E5",e10:"Super E10"};
      const $=(id)=>document.getElementById(id),statusEl=$("status"),manufacturerInput=$("manufacturer"),modelInput=$("model"),drivenKmInput=$("driven-km"),weeklyDistanceInput=$("weekly-distance"),remainingRangeInput=$("remaining-range"),suggestionsEl=$("suggestions"),selectedVehicleEl=$("selected-vehicle"),selectedNameEl=$("selected-name"),selectedMetaEl=$("selected-meta"),resultCard=$("result-card"),cycleChart=$("cycle-chart"),dayChart=$("day-chart"),cycleNote=$("cycle-note"),dayNote=$("day-note"),form=$("tankplan-form"),statisticsNavLink=$("statistics-nav-link");
      let vehicles=[],selectedVehicle=null,priceAnalysis=null,activeFuel="diesel",debounceTimer=null;
      function setStatus(t){statusEl.textContent=t}function norm(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[-_/]/g," ").replace(/\s+/g," ").trim()}function num(v){const n=Number(String(v||"").replace(",",".").trim());return Number.isFinite(n)?n:null}function fmtPrice(v){return v.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})}function fmtDate(d){return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"})}function fmtTime(d){return d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}function fmtShort(s){const[a,m,d]=String(s||"").split("-");return a&&m&&d?`${d}.${m}.`:s}function weekday(d){return["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()]}
      function parseCsv(text){const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell=""}else if(c!=="\r")cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}const h=rows.shift()||[];return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(h.map((x,i)=>[x,r[i]||""])))}
      function dateRange(){const p=new URLSearchParams(location.search),start=p.get("start")||"2026-04-18",end=p.get("end")||"2026-05-01",out=[],d=new Date(`${start}T00:00:00`),last=new Date(`${end}T00:00:00`);while(d<=last){out.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}return out}function dataPath(s){const[y,m,d]=s.split("-");return`data2/${y}/${m}/${d}/management_boxplots.json`}function fuelKey(v){const f=norm(v.kraftstoffart);if(f.includes("diesel"))return"diesel";if(f.includes("e10"))return"e10";if(f.includes("super")||f.includes("benzin"))return"e5";return null}
      async function loadVehicles(){const r=await fetch("data/adac_models_by_make.csv");if(!r.ok)throw Error("Fahrzeugdaten konnten nicht geladen werden.");vehicles=parseCsv(await r.text()).filter(v=>v.fahrzeugbezeichnung)}function overall(s,f){return Number((s.brand_distributions?.[f]||[]).find(x=>x.brand==="Gesamtmarkt")?.median)}
      async function loadPrices(){const dates=dateRange(),summaries=[];for(const date of dates){const r=await fetch(dataPath(date));if(r.ok)summaries.push({date,summary:await r.json()})}const groups=Object.fromEntries(FUELS.map(f=>[f,new Map()])),dayStats=Object.fromEntries(FUELS.map(f=>[f,[]]));summaries.forEach(({date,summary})=>FUELS.forEach(f=>{const base=overall(summary,f);if(!Number.isFinite(base))return;const vals=[];(summary.fuels?.[f]||[]).forEach(row=>{const h=Number(row.clock_hour)%24,c=Number(row.count),delta=Number(row.median);if(!Number.isFinite(h)||!Number.isFinite(c)||!Number.isFinite(delta)||c<=0)return;const price=base+delta,b=groups[f].get(h)||{sum:0,count:0};b.sum+=price*c;b.count+=c;groups[f].set(h,b);vals.push({hour:h,price,count:c})});if(vals.length){const w=vals.reduce((s,x)=>s+x.count,0),avg=vals.reduce((s,x)=>s+x.price*x.count,0)/w,best=vals.reduce((a,x)=>x.price<a.price?x:a),d=new Date(`${date}T00:00:00`);dayStats[f].push({date,weekday:weekday(d),averagePrice:avg,bestHour:best.hour,bestPrice:best.price,count:w})}}));const slots=[];for(let h=0;h<24;h++){const prices={},counts={};FUELS.forEach(f=>{const b=groups[f].get(h);counts[f]=b?.count||0;if(b?.count)prices[f]=b.sum/b.count});if(Object.keys(prices).length)slots.push({hour:h,label:`${String(h).padStart(2,"0")}:00`,prices,counts})}priceAnalysis={dates,slots,dayStats}}
      function meta(v){return[v.fahrzeugbezeichnung,v.generation,v.baujahr,v.kraftstoffart].filter(Boolean).join(" · ")}function clearSelection(){selectedVehicle=null;selectedVehicleEl.hidden=true;resultCard.hidden=true}function queueSuggestions(){clearTimeout(debounceTimer);debounceTimer=setTimeout(renderSuggestions,120)}
      function renderSuggestions(){const make=norm(manufacturerInput.value),model=norm(modelInput.value);suggestionsEl.replaceChildren();clearSelection();if(!make&&!model){suggestionsEl.hidden=true;return}const matches=vehicles.filter(v=>(!make||norm(v.hersteller).includes(make))&&(!model||norm(v.modell).includes(model)||norm(v.fahrzeugbezeichnung).includes(model))).slice(0,12);if(!matches.length){suggestionsEl.hidden=true;setStatus("Keine passenden Fahrzeuge gefunden.");return}matches.forEach(v=>{const b=document.createElement("button");b.className="tankplan-suggestion";b.type="button";b.innerHTML=`<strong>${v.hersteller} ${v.modell}</strong><span>${meta(v)}</span>`;b.addEventListener("click",()=>selectVehicle(v));suggestionsEl.append(b)});suggestionsEl.hidden=false;setStatus(`${matches.length} Vorschläge gefunden.`)}function selectVehicle(v){selectedVehicle=v;manufacturerInput.value=v.hersteller;modelInput.value=v.modell;selectedNameEl.textContent=`${v.hersteller} ${v.modell}`;selectedMetaEl.textContent=meta(v);selectedVehicleEl.hidden=false;suggestionsEl.hidden=true;const f=fuelKey(v);if(f){activeFuel=f;renderCharts()}setStatus("Fahrzeug ausgewählt. Du kannst die Kilometerdaten eingeben.")}
      function chooseBestDay(f,earliest,latest,start){const by=new Map();(priceAnalysis.dayStats[f]||[]).forEach(x=>{const b=by.get(x.weekday)||{sum:0,count:0,hours:new Map()};b.sum+=x.averagePrice;b.count++;const h=b.hours.get(x.bestHour)||{sum:0,count:0};h.sum+=x.bestPrice;h.count++;b.hours.set(x.bestHour,h);by.set(x.weekday,b)});let best=null;for(let off=earliest;off<=latest;off++){const d=new Date(start);d.setDate(start.getDate()+off);const s=by.get(weekday(d));if(!s?.count)continue;const price=s.sum/s.count;let hour=null;s.hours.forEach((x,h)=>{const p=x.sum/x.count;if(!hour||p<hour.price)hour={hour:h,price:p}});if(!best||price<best.price||(price===best.price&&off>best.daysFromNow))best={daysFromNow:off,date:d,weekday:weekday(d),price,bestHour:hour?.hour,bestHourPrice:hour?.price}}return best}
      function recommend(f,range,weekly){const daily=weekly/7,until=daily>0?Math.max(0,(range-50)/daily):0,latest=Math.max(0,Math.floor(until)),earliest=Math.max(0,latest-6),now=new Date(),bestDay=chooseBestDay(f,earliest,latest,now),slots=priceAnalysis.slots.filter(s=>s.prices[f]).sort((a,b)=>a.prices[f]-b.prices[f]),slot=bestDay?.bestHour!==undefined?{hour:bestDay.bestHour,label:`${String(bestDay.bestHour).padStart(2,"0")}:00`,price:bestDay.bestHourPrice}:{...slots[0],price:slots[0]?.prices[f]},date=new Date(now);date.setDate(now.getDate()+(bestDay?.daysFromNow??latest));date.setHours(slot.hour,0,0,0);return{date,slot,daysToTank:bestDay?.daysFromNow??latest,latest}}
      function metric(l,v){return`<div class="tankplan-metric"><span>${l}</span><strong>${v}</strong></div>`}function showMessage(m){resultCard.hidden=false;resultCard.innerHTML=`<h2>Hinweis</h2><p class="tankplan-note">${m}</p>`;setStatus(m)}
      function calculate(e){e.preventDefault();if(!selectedVehicle)return showMessage("Bitte wähle ein Fahrzeug aus der Vorschlagsliste aus.");const driven=num(drivenKmInput.value),weekly=num(weeklyDistanceInput.value),userRange=num(remainingRangeInput.value);if(!driven||driven<=0)return showMessage("Bitte die gefahrenen Kilometer seit der letzten Tankfüllung eingeben.");if(!weekly||weekly<=0)return showMessage("Bitte die Fahrtstrecke pro Woche eingeben.");if(norm(selectedVehicle.kraftstoffart)==="strom")return showMessage("Ups, leider ist die Kraftstoffsorte des gewählten Fahrzeugs nicht verfügbar :(. Aber kennst Du schon https://woladen.de/? Hier findest Du immer die günstigste Ladesäule in Deiner Nähe!");const f=fuelKey(selectedVehicle);if(!f||!priceAnalysis.slots.some(s=>s.prices[f]))return showMessage("Ups, leider ist die Kraftstoffsorte des gewählten Fahrzeugs nicht verfügbar :(.");const tank=num(selectedVehicle.tankgroesse_1),cons=num(selectedVehicle.verbrauch_l_pro_100_km);if(!tank||!cons)return showMessage("Für das gewählte Fahrzeug fehlen Verbrauch oder Tankgröße. Bitte wähle ein Fahrzeug mit vollständigen ADAC-Detaildaten aus.");const full=tank/cons*100,range=userRange!==null?userRange:Math.max(0,full-driven),effective=userRange!==null?tank/(driven+userRange)*100:cons,rec=recommend(f,range,weekly);activeFuel=f;renderCharts();resultCard.hidden=false;resultCard.innerHTML=`<h2>Tankempfehlung</h2><div class="tankplan-result-grid">${metric("Tage bis Termin",rec.daysToTank)}${metric("Datum",fmtDate(rec.date))}${metric("Uhrzeit",fmtTime(rec.date))}${rec.latest!==rec.daysToTank?metric("Spätestens in",`${rec.latest} Tagen`):""}</div><p class="tankplan-note">${selectedVehicle.fahrzeugbezeichnung}: Restreichweite ca. ${range.toLocaleString("de-DE",{maximumFractionDigits:1})} km, Verbrauch ca. ${effective.toLocaleString("de-DE",{maximumFractionDigits:1})} l/100 km.</p><p class="tankplan-note">Empfohlen wird Tanken am ${fmtDate(rec.date)} um ${fmtTime(rec.date)}, damit 50 km Restreichweite nicht unterschritten werden. Analysepreis ca. ${fmtPrice(rec.slot.price)} EUR/l.</p>`;setStatus("Tankempfehlung berechnet.")}
      function svg(n){return document.createElementNS("http://www.w3.org/2000/svg",n)}function line(x1,y1,x2,y2,c,w=1){const e=svg("line");e.setAttribute("x1",x1);e.setAttribute("y1",y1);e.setAttribute("x2",x2);e.setAttribute("y2",y2);e.setAttribute("stroke",c);e.setAttribute("stroke-width",w);return e}function tx(x,y,t,a="middle",c="#6b7280",s=13){const e=svg("text");e.setAttribute("x",x);e.setAttribute("y",y);e.setAttribute("text-anchor",a);e.setAttribute("fill",c);e.setAttribute("font-size",s);e.textContent=t;return e}function dot(x,y,r,c){const e=svg("circle");e.setAttribute("cx",x);e.setAttribute("cy",y);e.setAttribute("r",r);e.setAttribute("fill",c);return e}function y(v,min,max,top,h){return top+((max-v)/(max-min))*h}function domain(vals){const min=Math.min(...vals),max=Math.max(...vals),pad=Math.max(.01,(max-min)*.12);return{min:min-pad,max:max+pad}}function stepPath(points,getX,getY){return points.map((p,i)=>{const x=getX(p,i),yy=getY(p,i);if(i===0)return`M ${x} ${yy}`;const prevY=getY(points[i-1],i-1);return`L ${x} ${prevY} L ${x} ${yy}`}).join(" ")}function renderCharts(){if(!priceAnalysis)return;renderCycle();renderDay()}
      function renderCycle(){const pts=priceAnalysis.slots.filter(s=>s.prices[activeFuel]).map(s=>({x:s.hour>=12?s.hour-12:s.hour+12,hour:s.hour,price:s.prices[activeFuel]})).sort((a,b)=>a.x-b.x),W=1120,H=340,L=82,T=28,B=56,R=24,PW=W-L-R,PH=H-T-B,d=domain(pts.map(p=>p.price));cycleChart.setAttribute("viewBox",`0 0 ${W} ${H}`);cycleChart.replaceChildren();const g=svg("g");cycleChart.append(g);for(let i=0;i<5;i++){const v=d.min+i*(d.max-d.min)/4,yy=y(v,d.min,d.max,T,PH);g.append(line(L,yy,W-R,yy,"#e5e7eb"));g.append(tx(L-10,yy+4,fmtPrice(v),"end"))}const path=svg("path");path.setAttribute("d",stepPath(pts,p=>L+p.x/24*PW,p=>y(p.price,d.min,d.max,T,PH)));path.setAttribute("fill","none");path.setAttribute("stroke","#0f766e");path.setAttribute("stroke-width","3");g.append(path);pts.forEach(p=>{const x=L+p.x/24*PW,yy=y(p.price,d.min,d.max,T,PH);g.append(dot(x,yy,4,"#0f766e"));if(p.x%2===0)g.append(tx(x,H-B+26,String(p.hour).padStart(2,"0")))});cycleNote.textContent=`${FUEL_LABELS[activeFuel]}: günstigste Uhrzeit im betrachteten Zeitraum ist ${pts.reduce((b,p)=>p.price<b.price?p:b).hour}:00 Uhr.`}
      function renderDay(){const pts=priceAnalysis.dayStats[activeFuel]||[],W=1120,H=340,L=82,T=28,B=62,R=24,PW=W-L-R,PH=H-T-B,d=domain(pts.map(p=>p.averagePrice));dayChart.setAttribute("viewBox",`0 0 ${W} ${H}`);dayChart.replaceChildren();const g=svg("g");dayChart.append(g);for(let i=0;i<5;i++){const v=d.min+i*(d.max-d.min)/4,yy=y(v,d.min,d.max,T,PH);g.append(line(L,yy,W-R,yy,"#e5e7eb"));g.append(tx(L-10,yy+4,fmtPrice(v),"end"))}const path=svg("path");path.setAttribute("d",stepPath(pts,(p,i)=>L+i/Math.max(1,pts.length-1)*PW,p=>y(p.averagePrice,d.min,d.max,T,PH)));path.setAttribute("fill","none");path.setAttribute("stroke","#0f766e");path.setAttribute("stroke-width","3");g.append(path);const cheap=pts.reduce((b,p)=>p.averagePrice<b.averagePrice?p:b),exp=pts.reduce((b,p)=>p.averagePrice>b.averagePrice?p:b);pts.forEach((p,i)=>{const x=L+i/Math.max(1,pts.length-1)*PW,yy=y(p.averagePrice,d.min,d.max,T,PH);g.append(dot(x,yy,p===cheap||p===exp?5:3.5,"#0f766e"));if(i%2===0||i===pts.length-1)g.append(tx(x,H-B+26,`${p.weekday} ${fmtShort(p.date)}`))});dayNote.textContent=`${FUEL_LABELS[activeFuel]}: günstigster Tag ${cheap.weekday} ${fmtShort(cheap.date)} mit ca. ${fmtPrice(cheap.averagePrice)} EUR/l, teuerster Tag ${exp.weekday} ${fmtShort(exp.date)} mit ca. ${fmtPrice(exp.averagePrice)} EUR/l.`}
      async function init(){const search=location.search||"?start=2026-04-18&end=2026-05-01";statisticsNavLink.href=`management.html${search}`;try{await Promise.all([loadVehicles(),loadPrices()]);renderCharts();setStatus("Fahrzeugdaten und Preisanalysen sind geladen.")}catch(e){setStatus(e.message||"Daten konnten nicht geladen werden.")}}manufacturerInput.addEventListener("input",queueSuggestions);modelInput.addEventListener("input",queueSuggestions);form.addEventListener("submit",calculate);document.addEventListener("click",e=>{if(!suggestionsEl.contains(e.target)&&e.target!==modelInput&&e.target!==manufacturerInput)suggestionsEl.hidden=true});init();
    </script>
